:root{

body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}

header{background:var(--navy);color:#fff;border-bottom:3px solid var(--wine)}
header .wrap{padding-block:18px 26px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

h1{font:600 clamp(26px,6vw,34px)/1.15 var(--display);margin:0;text-wrap:balance}
.lead{margin:0;color:#d9e3e8;max-width:56ch}
main .wrap{padding-block:24px 40px;display:flex;flex-direction:column;gap:30px}
section{display:flex;flex-direction:column;gap:10px}
h2{font:600 22px/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:700 12.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
p{margin:0;max-width:62ch}
.access{background:var(--note);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.access h2{font-size:20px}
.access ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:r}
.route li{counter-increment:r;display:flex;gap:12px;align-items:flex-start}
.route li::before{content:counter(r);flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--goldlite);font:600 14px/28px var(--display);text-align:center}
.route li div{min-width:0}
.route .min{color:var(--muted);font-size:13.5px}
a.btn{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 16px;background:var(--paper);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit}
a.btn:hover,a.btn:focus-visible{border-color:var(--gold);background:var(--hover);outline:none}
a.btn:focus-visible{box-shadow:0 0 0 2px var(--gold)}
.cov{flex:none;width:56px;height:auto;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ic{flex:none;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:var(--navy);color:var(--goldlite)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx{min-width:0;flex:1}
.tx b{display:block;font-size:17px;line-height:1.25}
.tx span{display:block;color:var(--muted);font-size:13.5px}
.mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mail code{font:600 16px var(--body);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px;user-select:all}
.mail button{font:700 13px var(--body);background:var(--navy);color:var(--goldlite);border:0;border-radius:8px;padding:9px 12px;cursor:pointer}
footer .wrap{padding-block:0 28px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function btn(it){var ic=String(it[2]).indexOf('cover:')===0?'<img class="cov" alt="" src="'+COV[it[2].slice(6)]+'">':'<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">'+(P[it[2]]||P.book)+'</svg></span>';return '<a class="btn" href="'+esc(clr(it[1]))+'" target="_blank" rel="noopener">'+ic+'<span class="tx"><b>'+esc(it[0])+'</b>'+(it[3]?'<span>'+esc(it[3])+'</span>':'')+'</span></a>';}
var MAIL="contacto@musicmotionsuite.com";
function render(l){
  var t=T[l]; document.documentElement.lang=l;
  document.getElementById('h1').textContent=t.h1; document.getElementById('lead').textContent=t.lead;
  document.getElementById('foot').textContent=t.foot;
  var h='';
  h+='<section><h2>'+t.whoT+'</h2><p>'+t.who+'</p></section>';
  h+='<section><h2>'+t.offerT+'</h2><p>'+t.offer+'</p></section>';
  h+='<div class="access"><h2>'+t.accT+'</h2><ol>'+t.acc.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol><p>'+t.accNote+'</p></div>';
  h+='<section><h2>'+t.routeT+'</h2><ol class="route">'+t.route.map(function(r,i){return '<li><div><a href="'+esc(clr(ROUTE_LINKS[l][i]))+'" target="_blank" rel="noopener" style="color:inherit;font-weight:700">'+esc(r[0])+'</a> <span class="min">· '+r[2]+' '+t.min+'</span><br><span class="min">'+esc(r[1])+'</span></div></li>';}).join('')+'</ol></section>';
  var LS=lessons(LV[l].note);
  t.sec.forEach(function(s,k){h+='<section><h2>'+esc(s.t)+'</h2>'+s.items.map(btn).join('')+(k===0?'<h3>'+LV[l].h1+'</h3>'+LS.n1.map(btn).join('')+'<h3>'+LV[l].h2+'</h3>'+LS.n2.map(btn).join(''):'')+'</section>';});
  h+='<section><h2>'+t.contactT+'</h2><p>'+t.contact+'</p><div class="mail"><code id="mail">'+MAIL+'</code><button type="button" id="cp">'+t.copy+'</button></div></section>';
  document.getElementById('main').innerHTML=h;
  document.getElementById('cp').onclick=function(){var b=this;function ok(){b.textContent=t.copied;setTimeout(function(){b.textContent=t.copy;},1600);}
    try{navigator.clipboard.writeText(MAIL).then(ok,function(){sel();});}catch(e){sel();}
    function sel(){var r=document.createRange();r.selectNodeContents(document.getElementById('mail'));var s=getSelection();s.removeAllRanges();s.addRange(r);}};
  ['es','nl','en','fr','de'].forEach(function(k){document.getElementById('l-'+k).setAttribute('aria-pressed',k===l?'true':'false');});
}
function pick(){var h=(location.hash||'').slice(1).toLowerCase(); if(T[h]) return h;
  var n=(navigator.language||'es').slice(0,2).toLowerCase(); return T[n]?n:'en';}
document.querySelectorAll('.langs button').forEach(function(b){b.onclick=function(){var l=b.getAttribute('data-l'); try{history.replaceState(null,'','#'+l);}catch(e){location.hash=l;} render(l);};});
addEventListener('hashchange',function(){render(pick());});
render(pick());
</script>
