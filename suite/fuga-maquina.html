<style>
/* La máquina de fugas (2026-10-24, Mario: «armar este esqueleto con otro tema propuesto por la máquina, donde puedes cambiar
   la tonalidad como en el juego de melodías»). Mismo gabinete que la máquina de melodías: los rodillos proponen un SUJETO;
   la máquina calcula la respuesta, las entradas y el largo (modelo medido en El arte de la fuga) y lo abre en el Score con Salieri. */
:root{
  --night:#0b0b16; --cab:#14142a; --cab2:#1f1f40; --gold:#d6b450; --gold-d:#5a4a18; --wine:#7a1f2e; --wine-l:#b0324a;
  --paper:#f7f2e4; --ink:#0e2934; --teal:#38c0a6; --text:#ecebf6; --textm:#a2a0bc; --pink:#ff6f91; --sky:#5ec8ff;
  --display:'Bebas Neue',Impact,'Arial Narrow',sans-serif; --body:'Lato',Calibri,Arial,sans-serif; --mono:'DM Mono',Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#2a2a58 0%,var(--night) 55%);color:var(--text);font-family:var(--body);min-height:100vh;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));overflow-x:hidden}
.top{max-width:1080px;margin:0 auto 8px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:12px}
.top a{color:var(--gold);text-decoration:none;white-space:nowrap}.top a:hover{text-decoration:underline}
.top .langs{display:flex;gap:2px}.top .langs button{background:none;border:1px solid transparent;color:var(--textm);font-family:var(--mono);font-size:11px;letter-spacing:1px;padding:3px 6px;border-radius:4px;cursor:pointer}
.top .langs button:hover{color:var(--gold)}.top .langs button.on{background:var(--gold);color:#0a0a10;font-weight:500}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.cab{position:relative;background:linear-gradient(180deg,var(--cab2),var(--cab));border:2px solid var(--gold-d);border-top:5px solid var(--wine);border-radius:22px;
  padding:16px clamp(10px,2.6vw,24px) 20px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07)}
.marquee{text-align:center}
h1{font-family:var(--display);font-weight:400;letter-spacing:.06em;color:var(--gold);font-size:clamp(30px,7vw,58px);line-height:.95;margin:0;text-shadow:0 0 22px rgba(214,180,80,.45)}
.kicker{font-family:var(--display);font-size:clamp(15px,2.4vw,20px);letter-spacing:.22em;text-transform:uppercase;color:var(--sky);text-align:center;margin:2px 0 0}
.sub{font-size:14px;color:var(--textm);text-align:center;margin:6px 0 0}
.lights{display:flex;justify-content:space-between;margin:12px 4px 14px}
.lights i{width:clamp(6px,1.3vw,10px);height:clamp(6px,1.3vw,10px);border-radius:50%;background:var(--gold-d);flex:none}
.lights.run i{animation:bulb .66s steps(1) infinite}
.lights i:nth-child(3n+2){animation-delay:-.22s}.lights i:nth-child(3n){animation-delay:-.44s}
@keyframes bulb{0%,33%{background:var(--gold);box-shadow:0 0 10px var(--gold)}34%,100%{background:var(--gold-d);box-shadow:none}}
.reels{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:10px}
@media (max-width:760px){.reels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.reel{display:flex;flex-direction:column;gap:6px;min-width:0}
.fn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--textm);text-align:center;text-transform:uppercase}
.frame{position:relative;padding:9px;border-radius:14px;background:#0d0d1e;border:2px solid var(--gold-d)}
.frame.held{border-color:var(--teal);box-shadow:0 0 16px rgba(56,192,166,.45)}
.frame.spinning{border-color:var(--gold)}
.win{background:var(--paper);border-radius:8px;height:clamp(118px,19vw,156px);overflow:hidden;position:relative;
  box-shadow:inset 0 12px 14px -8px rgba(0,0,0,.5),inset 0 -12px 14px -8px rgba(0,0,0,.5)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.strip svg{display:block;width:100%;height:clamp(118px,19vw,156px)}
.strip.blur{filter:blur(1.2px)}
.lbl{font-family:var(--mono);font-size:12.5px;color:var(--text);text-align:center;min-height:1.4em;line-height:1.35}
.btn{font-family:var(--mono);font-size:13px;letter-spacing:.1em;padding:9px 14px;border:1px solid var(--gold-d);border-radius:8px;background:rgba(255,255,255,.02);color:var(--text);cursor:pointer;min-height:40px;touch-action:manipulation}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn:focus-visible,.spin:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn.on{background:var(--teal);border-color:var(--teal);color:#06231d}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hold{width:100%;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;margin-top:16px}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.grp .cl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--textm);text-transform:uppercase}
.grp .btn{padding:7px 10px;min-width:38px}
.spin{font-family:var(--display);font-size:34px;letter-spacing:.12em;color:#fff;background:radial-gradient(circle at 35% 30%,var(--wine-l),var(--wine) 70%);
  border:3px solid var(--gold);border-radius:999px;padding:10px 44px;cursor:pointer;box-shadow:0 7px 0 #3d0d16,0 12px 26px rgba(0,0,0,.5);touch-action:manipulation}
.spin:active{transform:translateY(5px);box-shadow:0 2px 0 #3d0d16}
.spin:disabled{opacity:.6;cursor:wait}
input[type=range]{accent-color:var(--gold);width:130px}
.banner{font-family:var(--display);letter-spacing:.08em;font-size:clamp(22px,4vw,30px);color:var(--gold);text-align:center;min-height:36px;margin-top:6px}
.plan{background:rgba(0,0,0,.28);border:1px solid var(--gold-d);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.plan h2{font-family:var(--display);font-weight:400;letter-spacing:.08em;color:var(--gold);font-size:26px;margin:0}
.plan .res{font-family:var(--mono);font-size:13px;color:var(--text);line-height:1.6}
.plan .res b{color:var(--gold);font-weight:500}
.grid{overflow-x:auto;padding-bottom:4px}
.grid table{border-collapse:separate;border-spacing:2px;font-family:var(--mono);font-size:10px}
.grid th{color:var(--textm);font-weight:400;text-align:right;padding-right:6px;white-space:nowrap}
.grid thead th{text-align:center;padding:0;min-width:22px}
.grid td{height:26px;min-width:22px;border-radius:4px;background:#1a1a30;text-align:center;color:#0e1016;font-weight:500}
.grid td.suj{background:var(--gold)}.grid td.resp{background:var(--teal)}.grid td.ent{background:var(--sky)}
.grid td.fin{background:var(--pink)}.grid td.cs{background:#3a3a62;color:var(--textm)}.grid td.epi{background:#2c2c4a;color:var(--textm)}
.grid td.cad{background:var(--wine-l);color:#fff}
.grid td.seq{background:#8a7bd8;color:#0e1016}
.stepv{display:inline-block;min-width:2.2em;text-align:center;font-family:var(--mono);font-size:15px;color:var(--gold)}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:11px;color:var(--textm)}
.leyenda i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:5px}
.how{color:var(--textm);font-size:14px;line-height:1.6;max-width:72ch;margin:0 auto}
.how b{color:var(--text)}
.nota{font-family:var(--mono);font-size:12px;color:var(--textm)}
@media (prefers-reduced-motion:reduce){.lights.run i{animation:none}}
</style>
</head>

</div>
<div class="plan" id="plan" aria-live="polite"></div>

    for(let lp=10;lp<=ps;lp+=2) m+=`<rect x="${hx-4}" y="${(y0+4*SS-lp*SS/2-.7).toFixed(1)}" width="20" height="1.4" fill="#0e2934"/>`;

  m+=`<rect x="${W-8}" y="${y0}" width="1.6" height="${4*SS}" fill="#0e2934"/>`;

seg('keys',[['F','F'],['C','C'],['G','G'],['D','D'],['A','A'],['E','E'],['B','B']],state.key,v=>state.key=v);
seg('alts',[['b','♭'],['n','♮'],['#','♯']],state.alt,v=>state.alt=v);
seg('modes',[['0','M'],['1','m']],state.mode,v=>state.mode=+v);
function setT(T){ T=Math.max(1,Math.min(8,T)); if(T===state.T) return; const old=state.bars; state.T=T; state.held=[];
  const nb=[old[0]]; for(let i=1;i<T-1;i++){ const pv=nb[i-1].deg[nb[i-1].deg.length-1]; nb.push(old[i]&&i<old.length-1&&!isSeq(i)?old[i]:isSeq(i)?seqBar(nb[i-H()],pv):makeBar(i,pv)); } if(T>1) nb.push(old[old.length-1]);
  state.bars=nb; if(!subjectOk(state.bars)) state.bars=newBars(); }
{ const el=document.getElementById('temas');
  el.innerHTML='<button class="btn" data-d="-1" aria-label="−1">◀</button><span class="stepv" id="tv">'+state.T+'</span><button class="btn" data-d="1" aria-label="+1">▶</button>';
  el.onclick=e=>{ const b=e.target.closest('button'); if(!b||state.spinning) return; stopPlay(); setT(state.T+(+b.dataset.d)); document.getElementById('tv').textContent=state.T; buildReels(); render(); }; }
seg('metros',[['4/4','4/4'],['3/4','3/4'],['3/8','3/8']],state.meter,v=>{ if(v===state.meter) return; state.meter=v; state.held=[]; state.bars=[]; state.bars=newBars(); },()=>buildReels());
seg('resps',[['V','DOMINANT'],['IV','SUBDOMINANT'],['inv','INVERSION']],state.resp,v=>state.resp=v);
seg('especies',[['simple','SIMPLE'],['stretto','STRETTO']],state.esp,v=>state.esp=v);
seg('voces',[['2','2'],['3','3'],['4','4']],state.n,v=>state.n=+v);
seg('tams',[['escuela','SCHOOL'],['bach','BACH']],state.tam,v=>state.tam=v);
document.getElementById('tempo').oninput=e=>{ state.bpm=+e.target.value; document.getElementById('bpm').textContent='♩ = '+state.bpm; };
document.getElementById('spin').onclick=spin; document.getElementById('play').onclick=play;
document.getElementById('save').onclick=save; document.getElementById('open').onclick=openScore;
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.code==='Space'&&e.target===document.body){ e.preventDefault(); spin(); } });
// el sujeto de partida: el del Contrapunctus I (Re La | Fa Re | Do♯ Re Mi | Fa · Sol Fa Mi Re)
state.bars=[{deg:[0,4],rh:[4,4]},{deg:[2,0],rh:[4,4]},{deg:[-1,0,1],rh:[4,2,2]},{deg:[2,3,2,1,0],rh:[3,1,1,1,2]}];
buildReels(); render();
</script>
