/* PULSE — el metrónomo de Music Motion, gratis (2026-11-20, Mario: «un metrónomo con una cualidad muy útil, que es
   encontrar el tempo del pulso tocando un área que adapta la velocidad y la luz»). Una página sola, sin cuenta.
   El reloj es el del audio (AudioContext): los clicks se programan un poco por adelantado y la luz se enciende
   cuando ese click suena, así nada se desfasa aunque la pantalla esté ocupada. */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;

.top{max-width:760px;margin:0 auto 6px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;font-family:'DM Mono',monospace;font-size:12px}
.top a{color:var(--gold);text-decoration:none}.top a:hover{text-decoration:underline}
.top .r{display:flex;gap:10px;align-items:center}
.langs{display:flex;gap:2px}
.langs button,.th{background:none;border:1px solid transparent;color:var(--textm);font:inherit;padding:2px 6px;border-radius:5px;cursor:pointer}
.langs button.on{background:var(--gold);color:var(--bg);font-weight:500}
.th{border-color:var(--border)}
#inst{display:none;font-family:'DM Mono',monospace;font-size:13px;color:var(--bg);background:var(--gold);border:none;border-radius:6px;padding:5px 10px;cursor:pointer}
#iosHint{display:none;max-width:760px;margin:0 auto 6px;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;text-align:center}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(28px,6vw,40px);letter-spacing:.06em;margin:6px 0 0;color:var(--text)}
h1 span{color:var(--gold)}
.sub{margin:-6px 0 0;color:var(--textm);font-size:15px;text-align:center}
/* el círculo: es la luz y es donde se toca */
#pad{position:relative;width:min(78vw,46vh,380px);aspect-ratio:1;border-radius:50%;border:3px solid var(--gold);
  background:radial-gradient(circle at 50% 42%,var(--panel) 0%,var(--bg) 100%);cursor:pointer;user-select:none;touch-action:manipulation;

#pad:focus-visible{box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 45%,transparent)}
#pad.b{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--teal) 70%,var(--panel)) 0%,var(--panel) 100%);box-shadow:0 0 38px color-mix(in srgb,var(--teal) 70%,transparent)}
#pad.b1{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--gold) 85%,var(--panel)) 0%,var(--panel) 100%);box-shadow:0 0 54px color-mix(in srgb,var(--gold) 80%,transparent);transform:scale(1.015)}

.dots{display:flex;gap:10px;min-height:16px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--border);display:block;transition:background .05s}
.dots i.on{background:var(--teal);border-color:var(--teal)}
.dots i.one.on{background:var(--gold);border-color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
button.b,select{font-family:'DM Mono',monospace;font-size:15px;letter-spacing:1px;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px}

.grp>span{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--textd);margin-right:2px}

.seg button.on{background:var(--teal);color:var(--bg)}

.how{max-width:620px;color:var(--textm);font-size:14px;line-height:1.55;border-top:1px solid var(--border);padding-top:12px;margin-top:4px}
.how b{color:var(--text)}

.foot{font-family:'DM Mono',monospace;font-size:12px;color:var(--textd);text-align:center}

:fullscreen body,body.fs{display:flex;align-items:center}

  // promedio de los últimos intervalos, sin el que se sale mucho (un toque que se escapó)
  var iv=[]; for(var i=1;i<taps.length;i++) iv.push(taps[i]-taps[i-1]);
  var srt=iv.slice().sort(function(a,b){return a-b;}), med=srt[Math.floor(srt.length/2)];
  var ok=iv.filter(function(x){ return Math.abs(x-med)<med*0.3; }), avg=ok.reduce(function(a,b){return a+b;},0)/ok.length;
  setBpm(60/avg,true);
  // la luz sigue al dedo: este toque es un tiempo, y el próximo cae un tiempo después. La serie de toques
  // empieza en el tiempo 1 del compás.
  var k=taps.length-1, nb=Math.max(1,S.beats);
  flash({kind:(S.beats>1&&k%nb===0)?1:2,inBar:S.beats>1?k%nb:0,isBeat:true});
  if(!on){ on=true; if(timer) clearInterval(timer); timer=setInterval(sched,25); lock(true); }
  drop(now+0.005); next=now+spb(); step=(k+1)*S.sub; sched(); ui(); }

// ── tempo ──
function setBpm(v,fromTap){ S.bpm=Math.max(MIN,Math.min(MAX,Math.round(v))); save(); ui(); }
function nearest(){ var b=TERMS[0]; TERMS.forEach(function(x){ if(Math.abs(x[1]-S.bpm)<Math.abs(b[1]-S.bpm)) b=x; }); return b; }
var sel=$('terms'); sel.innerHTML=TERMS.map(function(x){ return '<option value="'+x[1]+'">'+x[0]+' · '+x[1]+'</option>'; }).join('');
sel.onchange=function(){ setBpm(+this.value); };
function seg(id,vals,key){ var el=$(id); el.innerHTML=vals.map(function(v){ return '<button data-v="'+v+'">'+v+'</button>'; }).join('');
  el.onclick=function(e){ var b=e.target.closest('button'); if(!b) return; var v=+b.dataset.v;
    if(key==='sub'&&on&&v!==S.sub){ // cambiar la subdivisión sin perder el pulso: se retoma en el próximo tiempo
      var o=S.sub, k=(o-step%o)%o, tb=next+k*spb()/o, bi=(step+k)/o; drop(ctx.currentTime); next=tb; step=bi*v; }
    S[key]=v; save(); ui(); dotsBuild(); }; }
seg('beats',[1,2,3,4,5,6,7],'beats'); seg('subs',[1,2,3,4],'sub');
function dotsBuild(){ var d=$('dots'), n=S.beats>1?S.beats:0, h=''; for(var i=0;i<n;i++) h+='<i class="'+(i===0?'one':'')+'"></i>'; d.innerHTML=h; }
function dots(k){ [].forEach.call($('dots').children,function(e,i){ e.classList.toggle('on',i===k); }); }
function ui(){ $('bpm').textContent=S.bpm; var nb=nearest(); $('term').textContent=Math.abs(nb[1]-S.bpm)<=6?nb[0]:'';
  sel.value=String(nb[1]); $('go').textContent=on?t.stop:t.start; $('go').classList.toggle('on',on);
  [].forEach.call($('beats').children,function(b){ b.classList.toggle('on',+b.dataset.v===S.beats); });
  [].forEach.call($('subs').children,function(b){ b.classList.toggle('on',+b.dataset.v===S.sub); });
  $('click').classList.toggle('on',S.click); $('vol').value=S.vol; $('tone').value=S.tone;
  $('hint').style.visibility=on?'hidden':'visible'; }
// botones que se repiten al mantenerlos apretados
function hold(el,fn){ var tm=null,iv=null; function end(){ clearTimeout(tm); clearInterval(iv); }
  el.addEventListener('pointerdown',function(e){ e.preventDefault(); fn(); tm=setTimeout(function(){ iv=setInterval(fn,70); },420); });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ el.addEventListener(ev,end); }); }
hold($('minus'),function(){ setBpm(S.bpm-1); }); hold($('plus'),function(){ setBpm(S.bpm+1); });
$('go').onclick=function(){ on?stop():start(); };
$('click').onclick=function(){ S.click=!S.click; save(); ui(); };
$('vol').oninput=function(){ S.vol=+this.value; save(); };
$('tone').oninput=function(){ S.tone=+this.value; save(); };
$('tone').ondblclick=function(){ S.tone=52; save(); ui(); };
pad.addEventListener('pointerdown',function(e){ e.preventDefault(); tap(); });
function fsToggle(){ var d=document.documentElement;
  if(document.fullscreenElement||document.body.classList.contains('fs')){ if(document.exitFullscreen&&document.fullscreenElement) document.exitFullscreen(); document.body.classList.remove('fs'); }
  else { document.body.classList.add('fs'); if(d.requestFullscreen) d.requestFullscreen().catch(function(){}); } }
$('fs').onclick=fsToggle;
document.addEventListener('fullscreenchange',function(){ if(!document.fullscreenElement) document.body.classList.remove('fs'); });
document.addEventListener('keydown',function(e){ if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); if(!e.repeat) tap(); }
  else if(e.key==='Enter'){ e.preventDefault(); on?stop():start(); }
  else if(e.key==='ArrowRight'){ setBpm(S.bpm+1); } else if(e.key==='ArrowLeft'){ setBpm(S.bpm-1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); setBpm(S.bpm+5); } else if(e.key==='ArrowDown'){ e.preventDefault(); setBpm(S.bpm-5); }
  else if(e.key==='f'||e.key==='F'){ fsToggle(); }
  else if(e.key==='Escape'&&document.body.classList.contains('fs')){ fsToggle(); } });
dotsBuild(); ui();
window._pulse={S:S,tap:tap,start:start,stop:stop,get on(){return on;}};   // para las pruebas
})();
</script>
