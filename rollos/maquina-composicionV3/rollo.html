.mmq{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:8px;vertical-align:2px;border:none;border-radius:50%;background:var(--acc);color:#fff;font:700 13px/1 system-ui,sans-serif;cursor:pointer;padding:0}

#mmMuestra{display:none;max-width:1280px;margin:0 auto 6px;padding:8px 12px;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-top:2px solid #501828;border-radius:8px;font-size:13px;color:var(--muted)}

<body>
<!-- LA PUERTA DE SALIERI (2026-11-23, Mario: «estos rollos van a subir pero abren solo con Salieri activado»). En el sitio, sin el pase del Music School
     Coach, el rollo no se ve: salen este candado y la ventana del pase, la misma de las páginas de Salieri (/suite/mm-salieri.js). En el PC —localhost, o la
     página abierta del disco— el rollo abre siempre, para trabajar. ?salieri=test abre en las presentaciones, como en todo el sitio. -->
<div id="mmCandado"><p id="mmCandadoT"></p><button class="btn" id="mmCandadoB" type="button">MUSIC SCHOOL COACH</button></div>
<script>
(function(){ var MUESTRA_YA=/[?&]muestra\b/.test(location.search);   // ?muestra: la muestra también en el PC, para probarla
  if(!MUESTRA_YA&&(location.protocol==='file:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))) return;
  var H=document.documentElement, es=false; try{ es=localStorage.getItem('mmSiteLang')==='es'; }catch(e){}
  H.classList.add('mm-puerta');   // tapado hasta saber si hay pase
  document.getElementById('mmCandadoT').textContent=es?'Este rollo es parte del Music School Coach: el catálogo de orquestación, las clases de armonía y contrapunto, y el maestro exigente de la suite.':"This roll is part of the Music School Coach: the orchestration catalogue, the harmony and counterpoint classes, and the suite's demanding master.";
  document.getElementById('mmCandadoB').onclick=function(){ if(window.mmSalieriPuerta) mmSalieriPuerta(); };
  window.addEventListener('keydown',function(e){ if(H.classList.contains('mm-puerta')) e.stopImmediatePropagation(); },true);   // tapado, las teclas no llegan al rollo (la barra espaciadora no suena)
  var abre=function(){ H.classList.remove('mm-puerta','mm-cerrado'); var w=document.getElementById('mm-salieri-pase'); if(w) w.classList.remove('open'); },
      // 2026-11-26 (como en el rollo de corales V2.0.5): sin pase ya no sale el candado sino la muestra (la Fuga n.º 1); el candado queda solo si la muestra no puede abrir
      cierra=function(){ H.classList.remove('mm-puerta'); H.classList.add('mm-demo'); window.MM_MUESTRA=true;
        var go=function(){ if(window.mmMuestra) mmMuestra(); else { H.classList.remove('mm-demo'); H.classList.add('mm-puerta','mm-cerrado'); } };
        if(document.readyState==='complete') go(); else window.addEventListener('load',go); };
  document.addEventListener('mm-salieri',function(){ if(H.classList.contains('mm-demo')) location.reload(); else abre(); });   // el pase llega (también después de «Ya pagué — volver a mirar»)   // el pase llega (también después de «Ya pagué — volver a mirar»)
  var s=document.createElement('script'); s.src='/suite/mm-salieri.js';
  s.onload=function(){ if(mmSalieriAbierto()) return abre(); mmSalieriVerificar().then(function(v){ if(v) abre(); else cierra(); },cierra); };
  if(MUESTRA_YA){ cierra(); return; }
  s.onerror=cierra; document.head.appendChild(s); })();
</script>

<script>
// V3 — CONTRAPUNTO Y FUGA (2026-11-01, Mario: «prefiero hacer la V3 basado en esta página de corales y trabajando el contrapunto y fuga de Bach
// e similitud de los corales; una flecha nos pasaría a otra ventana, similarmente, sin títulos por ahora; utiliza el mismo formato de botones»).
// Copia de la hoja del rollo de corales (V2) sobre otro rollo: las 48 fugas del Clave bien temperado (las dos a 5 voces quedan fuera), las
// 15 sinfonías y las 15 invenciones, una voz por pentagrama (a 3 voces calla el tenor; a 2, soprano y bajo). Lo que cambia: las voces
// pueden callar (el acorde del borde es el de las que suenan), no hay calderones (cierra el compás que termina en la tónica con el bajo en
// la tónica), la conducción admite 7 semitonos en todas las voces, y FRASE todavía no tiene frases (las entradas del sujeto vendrán después).
// ── La máquina de composición · el rollo barroco (2026-10-31, con Mario) ─────────────────────────────────────────────
// Mario: «reunir en un rollo los compases de las obras a cuatro pentagramas, en la misma tonalidad, para que la máquina
// escoja compases y forme los grupos que propone el coral de BAROQUE» · «cuando se escogen 3 o 2 compases, los más cercanos
// al calderón; cuando es 1, el primero — o random cualquiera» · «como la máquina de armonía: congelar unos compases del rollo
// y rodarlo para cambiar los que no están held; abrirlo y devolverlo con el Score; poder escoger 4 compases, o sea 3 antes
// del calderón».
// Cada rodillo es un compás real de un coral de Bach (en Do mayor o la menor). Las uniones entre compases tienen que ser
// una que Bach hace en algún coral (el mismo bajo y las mismas notas del acorde), con las voces cerca, sin cruces y sin
// quintas ni octavas paralelas; el último compás cierra con calderón en la tónica.
'use strict';
const D=window.ROLLO, BARS=D.bars, TR=new Set(D.tr), N0=BARS.length;
const KEYIDX=new Map(D.keys.map((k,i)=>[k[0]+'|'+k[1].join(','),i]));
const CUSTOM={};   // compases que volvieron del Score (o entraron por el buzón): índice ≥ N0
// b = [coral, compás, modo, cifra, calderón, voces, ini, fin, ligIni, ligFin, kIni, kFin, cierra]
const B=i=>i>=M0?MED[i-M0]:BARS[i];
// ── ½ compás (Mario, 2026-11-01: «¿no sé si se puede mezclar por ½ compás?»): cada mitad de un compás es una unidad del rollo.
// Las mitades «a» (primer tiempo) van en las posiciones pares y las «b» en las impares, así cada par arma un compás entero con su
// acento en su sitio; de «a» a «b» rige la unión que Bach hace a mitad de compás (TRM) y de «b» a «a» la de la barra (TR). Una nota
// que cruza la mitad se parte en dos ligadas; una mitad que empieza o termina con ligadura no se une con otra que no sea la suya.
// Las unidades viven en MED (id ≥ M0): el mismo formato que un compás, más [15] mitad (0/1) y [16] id del compás de origen.
const M0=10000000, MED=[], MEDK=new Map(), TRM=new Set(); let MEDOK=false;
const U=()=>state.uni==='medio'?2:1, PASO=()=>(state.pasoB||4)*U();
const deBach=i=>i<N0||(i>=M0&&B(i)[16]<N0);
const cifLen=ci=>{ const [n,d]=D.cifras[ci].split('/').map(Number); return n*96/d; };
const medioVale=cif=>Number(cif.split('/')[0])%2===0;   // sólo compases que se parten en dos mitades iguales de tiempos enteros (4/4 · 2/2 · 6/8)
function kidDe(ch,add){ const q=ch.filter(x=>x>=0); if(!q.length) return -1; const k=(Math.min(...q)%12)+'|'+[...new Set(q.map(x=>x%12))].sort((a,b)=>a-b).join(','); if(!KEYIDX.has(k)){ if(!add) return -1; KEYIDX.set(k,KEYIDX.size); } return KEYIDX.get(k); }
function mitad(i,h){ const key=i*2+h; if(MEDK.has(key)) return MEDK.get(key); const b=B(i); if(!b) return null; const L=cifLen(b[3])/2;
  const voces=b[5].map(ns=>{ const out=[]; for(const n of ns){ const [m,o,d,t]=n; if(o+d<=L){ if(h===0) out.push(n); } else if(o>=L){ if(h===1) out.push([m,o-L,d,t,...n.slice(4)]); }
      else { if(h===0) out.push([m,o,L-o,m<0?0:(t===2||t===3?3:1),...n.slice(4)]); else out.push([m,0,o+d-L,m<0?0:(t===1||t===3?3:2),...n.slice(4)]); } } return out; });
  const first=ns=>ns[0]&&ns[0][1]===0&&ns[0][0]>=0?ns[0]:null, last=ns=>{ const z=ns.filter(n=>n[0]>=0); return z.length?z[z.length-1]:null; };
  const ini=voces.map(ns=>{ const n=first(ns); return n?n[0]:-1; }), fin=voces.map(ns=>{ const n=last(ns); return n?n[0]:-1; });
  const lI=voces.some(ns=>{ const n=first(ns); return n&&(n[3]===2||n[3]===3); })?1:0, lF=voces.some(ns=>{ const n=last(ns); return n&&(n[3]===1||n[3]===3); })?1:0;
  const ok=ini.some(x=>x>=0)&&fin.some(x=>x>=0), ff=b[13]==null?-1:b[13];
  const fe=b[4]&&(h===0?(ff>0&&ff<=L):(ff<0||ff>L))?1:0, ffin=!fe?-1:h===0?ff:(ff<0?-1:ff-L);
  const ci=h===1?(b[12]||0):0;
  const u=[b[0],b[1],b[2],b[3],fe,voces,ini,fin,lI,lF,kidDe(ini,i<N0),kidDe(fin,i<N0),ci,ffin,(b[14]||!ok)?1:0,h,i];
  MED.push(u); const id=M0+MED.length-1; MEDK.set(key,id); return id; }
function armaMedios(){ if(MEDOK) return; MEDOK=true; for(let i=0;i<N0;i++){ const b=BARS[i]; if(!b) continue; const a=B(mitad(i,0)), z=B(mitad(i,1)); if(!a[14]&&!z[14]&&a[11]>=0&&z[10]>=0) TRM.add(a[11]+'>'+z[10]); } }
const par=(j,k)=>state.uni!=='medio'||B(j)[15]===k%2;   // en ½, la posición decide la mitad: pares «a», impares «b»
const state={uni:'compas',fr:null,modo:0,cif:'4/4',T:4,tipo:'azar',bars:[],held:[],spinning:false,bpm:72,vol:.65};
const undoS=[];
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const CIF=full=>{ const [n,d]=state.cif.split('/').map(Number); const len=n*96/d; return {n,d,len:(!full&&state.uni==='medio')?len/2:len}; };   // en ½ la unidad mide la mitad; CIF(true) = el compás entero   // largo del compás en 24avos de negra

// ── las reglas de la unión ──
function paralelas(a,b){ const m=x=>((x%12)+12)%12;
  for(let i=0;i<4;i++) for(let j=i+1;j<4;j++){ if(a[i]<0||a[j]<0||b[i]<0||b[j]<0) continue;
    for(const iv of [7,0]) if(m(a[i]-a[j])===iv&&m(b[i]-b[j])===iv&&a[i]!==b[i]) return true; }
  return false; }
function une(ia,ib){ const a=B(ia), b=B(ib); if(!a||!b) return false; if(a.length>15&&b.length>15&&a[15]===0&&b[15]===1&&a[16]===b[16]) return true;   // las dos mitades de un mismo compás: Bach
  if(b[8]||a[9]) return false;
  if(a[11]>=0&&b[10]>=0&&!(a.length>15&&a[15]===0?TRM:TR).has(a[11]+'>'+b[10])) return false;   // un compás del Score con un acorde que el rollo no tiene: sólo la conducción
  for(let k=0;k<4;k++){ if(a[7][k]<0||b[6][k]<0) continue; if(Math.abs(a[7][k]-b[6][k])>7) return false; }   // V3: líneas instrumentales, 7 para todas
  for(let k=0;k<3;k++) if(b[6][k]>=0&&b[6][k+1]>=0&&b[6][k]<b[6][k+1]) return false;
  return !paralelas(a[7],b[6]); }
const cierra=i=>!!B(i)[12];

// ── el rollo de esta tonalidad y esta cifra ──
let POOL=[], POOLSET=new Set(), SUCC=new Map();
function armaPool(){ const ci=D.cifras.indexOf(state.cif); POOL=[]; if(state.uni==='medio'){ armaMedios(); BARS.forEach((b,i)=>{ if(b&&i<N0&&b[2]===state.modo&&b[3]===ci&&!b[14]) for(const h of [0,1]){ const u=mitad(i,h); if(!B(u)[14]) POOL.push(u); } }); } else BARS.forEach((b,i)=>{ if(b&&i<N0&&b[2]===state.modo&&b[3]===ci&&!b[14]) POOL.push(i); });
  POOLSET=new Set(POOL); SUCC=new Map();
  FRL={}; (D.frases||[]).forEach(f=>{ const b=B(f[1]); if(b[2]!==state.modo||b[3]!==ci) return; (FRL[f.length-1]=FRL[f.length-1]||[]).push(f); }); }
let FRL={};
// la nota del calderón en la voz v: la que termina donde termina el calderón (en 4/4 suele caer a mitad de compás, con la anacrusa detrás)
function fNota(b,v){ const ns=b[5][v], f=b[13]; if(f==null||f<0) return ns.length-1; let j=ns.findIndex(n=>n[0]>=0&&n[1]+n[2]===f); if(j<0) j=ns.findIndex(n=>n[0]>=0&&n[1]<f&&n[1]+n[2]>=f); return j<0?ns.length-1:j; }
function succ(i){ if(!SUCC.has(i)) SUCC.set(i,POOL.filter(j=>une(i,j))); return SUCC.get(i); }

// ── rodar: se cambian sólo los compases que no están en HOLD ──
// Cada compás es una unidad (Mario: «trata cada compás como una unidad, escogemos aleatoriamente los compases que podemos
// held or not»): los que no están en HOLD se escogen al azar, con uniones que Bach hace.
function huecos(){ const out=[]; let s=-1; for(let i=0;i<=state.T;i++){ const libre=i<state.T&&!state.held[i]; if(libre&&s<0) s=i; if(!libre&&s>=0){ out.push([s,i-1]); s=-1; } } return out; }
function llenaAzar(s,e,bars,usados){ const der=e+1<state.T?bars[e+1]:null, ult=e===state.T-1;
  for(let t=0;t<2500;t++){ const out=[]; const ya=new Set(usados);
    for(let i=s;i<=e;i++){ const prev=out.length?out[out.length-1]:(i>0?bars[i-1]:null), last=i===e;
      let c=prev==null?POOL.filter(j=>!B(j)[8]):succ(prev);
      c=c.filter(j=>par(j,i)&&(t>=600||!ya.has(B(j)[0]))&&(!last||((!ult||cierra(j))&&(der==null||une(j,der)))));   // si no alcanza, se permite repetir coral
      if(!c.length) break; const j=pick(c); out.push(j); ya.add(B(j)[0]); }
    if(out.length===e-s+1) return out; }
  return null; }
function nuevos(){ const bars=state.bars.slice(0,state.T); while(bars.length<state.T) bars.push(null);
  const usados=new Set(bars.filter((b,i)=>b!=null&&state.held[i]&&deBach(b)).map(b=>B(b)[0])); let falta=0;
  for(const [s,e] of huecos()){ const r=llenaAzar(s,e,bars,usados);
    if(!r){ falta++; continue; }
    r.forEach((j,k)=>{ bars[s+k]=j; usados.add(B(j)[0]); }); }
  return {bars,falta}; }

// ── el dibujo: el pentagrama doble, soprano y contralto arriba, tenor y bajo abajo ──
const GL=window.MM_GL, SS=10, K=SS/250, C='#0e2934', TPOS={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
const g=(n,x,y,fill)=>`<path fill="${fill||C}" transform="translate(${x.toFixed(2)},${y.toFixed(2)}) scale(${K.toFixed(4)},${(-K).toFixed(4)})" d="${GL[n]}"/>`;
const NOM=[['C',0],['C',1],['D',0],['E',-1],['E',0],['F',0],['F',1],['G',0],['G',1],['A',0],['B',-1],['B',0]];
const spell=m=>{ const [l,a]=NOM[((m%12)+12)%12]; return {letter:l,acc:a,oct:Math.floor(m/12)-1}; };
// ── la tonalidad (Mario, 2026-10-31: «antes de OPEN IN SCORE, C D E F G A H, así ya tenemos todas las tonalidades, pero sin cambiar
// la armadura: en Fa mayor un si lleva su bemol; y un botón SIGNATURE que sí pone la armadura»). El rollo sigue por dentro en
// Do mayor / la menor (las uniones se miden ahí); al dibujar, tocar y exportar se transporta por intervalo, con la escritura
// conservada: letra + alteración, nunca deletreada desde el MIDI. H = si (uso alemán).
// LAS DOCE TÓNICAS (2026-11-23, Mario: «es un límite no poder escoger una armadura al comienzo… ¿puedes transportar el banco a la tonalidad de la armadura?»).
// A las siete de nota natural se suman C♯ E♭ F♯ A♭ B♭. La escritura depende del modo: C♯ es Re♭ mayor / do♯ menor; A♭ es La♭ mayor / sol♯ menor.
const TON_X={Cs:[[1,-1,-5,'Re♭'],[0,1,4,'Do♯']],Eb:[[2,-1,-3,'Mi♭'],[2,-1,-6,'Mi♭']],Fs:[[3,1,6,'Fa♯'],[3,1,3,'Fa♯']],Ab:[[5,-1,-4,'La♭'],[4,1,5,'Sol♯']],Bb:[[6,-1,-2,'Si♭'],[6,-1,-5,'Si♭']]}, TROT={Cs:'C♯',Eb:'E♭',Fs:'F♯',Ab:'A♭',Bb:'B♭'};
const tonI=(ton,modo)=>{ const x=TON_X[ton]; if(x){ const y=x[modo?1:0]; return {let:y[0],alt:y[1],fif:y[2],nom:y[3]}; } return {let:TLET[ton],alt:0,fif:FIF[modo?'m':'M'][ton],nom:NOMT[ton]}; };
const TONS=['C','Cs','D','Eb','E','F','Fs','G','Ab','A','Bb','H'], TLET={C:0,D:1,E:2,F:3,G:4,A:5,H:6}, TPC=[0,2,4,5,7,9,11], NOMT={C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',H:'Si'};
const FIF={M:{C:0,D:2,E:4,F:-1,G:1,A:3,H:5},m:{C:-3,D:-1,E:1,F:-4,G:-2,A:0,H:2}}, KSN={'-7':'Cb','-6':'Gb','-5':'Db','-4':'Ab','-3':'Eb','-2':'Bb','-1':'F','0':'C','1':'G','2':'D','3':'A','4':'E','5':'B','6':'F#','7':'C#'};
state.ton='C'; state.sig=false; state.tons=[]; state.chunk=[0,0];   // ton: la tonalidad elegida · tons[k]: la de cada compás · chunk: los compases a los que se aplica (los últimos que entraron)
// Mario (23:23): «no tiene que transportar lo que ya está held, solo aplica al compás/s aumentado»: cada compás guarda su tonalidad;
// C D E F G A H cambian la de los compases del último + (o de toda la hoja si es nueva); los anteriores se quedan en la suya.
const tonDe=k=>state.tons[k]||'C';
const modoDe=k=>{ const b=state.bars[k]!=null?B(state.bars[k]):null; return b?b[2]:state.modo; };   // el modo lo guarda cada compás (b[2]); M / m valen para el tramo actual (Mario, 2026-11-01: «M y m no deben transponer todo lo que ya está fijo»)   // al achicar la hoja (botones 1 2 3 4 8 16), el tramo actual sigue siendo el último que empezó dentro de ella
function TRI(ton=state.ton,modo=state.modo){ const base=modo?5:0, ti=tonI(ton,modo), st=(ti.let-base+7)%7, steps=st>3?st-7:st, sm=(TPC[ti.let]+ti.alt-TPC[base]+24)%12; return {steps,semis:steps<0?sm-12:sm}; }   // el camino más corto desde Do / la
function trN(n,I){ if(n[0]<0||!I.steps) return n; const [m,o,d,t,si,al,oc]=n; let s=si, c=oc; if(s==null){ const p=spell(m); s=TPOS[p.letter]; c=p.oct; }
  const L=s+I.steps, s2=((L%7)+7)%7, c2=c+Math.floor(L/7), m2=m+I.semis; return [m2,o,d,t,s2,m2-(12*(c2+1)+TPC[s2]),c2]; }
function trB(b,ton=state.ton){ const I=TRI(ton,b?b[2]:state.modo); if(!b||!I.steps) return b; const c=b.slice(); c[5]=b[5].map(v=>v.map(n=>trN(n,I))); return c; }
const KFI=(ton=state.ton,modo=state.modo)=>state.sig?tonI(ton,modo).fif:0;
const tonNombre=(ton=state.ton,modo=state.modo)=>{ const nm=tonI(ton,modo).nom; return modo?nm.toLowerCase()+' menor':nm+' mayor'; };
