<style>
:root{--bg:#f4f3ef;--panel:#ffffff;--line:#d8d5cc;--line2:#b9b5aa;--text:#22252b;--muted:#6b6f78;--acc:#2f6f62;--acc-t:#ffffff;--paper:#fffdf8;color-scheme:light;--border:var(--line);--kb-border:#501828;--textm:var(--muted);--gold:var(--acc);--panel2:var(--bg)}   /* --border … --panel2: lo que lee la paleta de instrumentos del banco (mm-presets.js) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--panel:#202226;--line:#34373d;--line2:#4a4e56;--text:#e6e6e6;--muted:#9a9ea6;--acc:#4fb39c;--acc-t:#0b1f1a;--paper:#fbf9f3;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:12px max(12px,env(safe-area-inset-left,0px)) 24px max(12px,env(safe-area-inset-right,0px));min-height:100vh}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;max-width:1280px;margin:0 auto}
.bar .br{flex-basis:100%;height:0}
.grp{display:flex;align-items:center;gap:3px}
.sep{width:1px;align-self:stretch;background:var(--line)}
.btn{font:inherit;font-size:12.5px;min-height:32px;min-width:30px;padding:4px 6px;border:1px solid var(--line2);border-radius:7px;background:transparent;color:var(--text);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--acc)}
.btn.on{background:var(--acc);border-color:var(--acc);color:var(--acc-t)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.spin{font:inherit;font-weight:600;font-size:13px;letter-spacing:.08em;min-height:34px;padding:5px 16px;border-radius:7px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-t);cursor:pointer}
.spin:disabled{opacity:.6;cursor:wait}
.sonando{border-color:var(--acc);color:var(--acc)}
.cc.toca{background:rgba(79,179,156,.22);box-shadow:inset 0 0 0 2px var(--acc);transition:none}
#pinR{position:absolute;top:30px;bottom:0;width:2px;margin-left:-1px;background:#e0223c;pointer-events:none;z-index:2}
.cc svg{cursor:ew-resize}
#rollo.pinando,#rollo.pinando *{cursor:ew-resize!important;user-select:none}
input[type=range]{width:62px;accent-color:var(--acc)}
.fn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px}
.titulo{max-width:1280px;margin:0 auto 6px;font-size:15px;font-weight:600;color:var(--text)}
.titulo small{font-weight:400;color:var(--muted);font-size:13px}
/* 2026-11-27 (Mario): la cabecera lleva el logo m∆°m y el título en el verde del rollo; el subtítulo, en una segunda línea */
.titulo{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;color:var(--acc);line-height:1.2}
.titulo small{display:block;margin-top:3px;font-size:13px;font-weight:400;color:var(--muted)}
.titulo .tit-logo{flex:none;display:inline-flex;color:var(--acc);border-radius:4px}
.titulo .tit-logo svg{display:block;height:24px;width:auto;fill:currentColor}
.titulo .tit-logo:hover{opacity:.8}.titulo .tit-logo:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
/* EL «?» (2026-11-26, Mario: «un signo ? entre un botoncito circular verde, con ? en blanco adentro»): abre #mmAyuda, la ventana de la casa
   (borde wine arriba, pin ⊗ ON al abrir, header arrastrable, clic afuera cierra si no está fijado), con un párrafo y el enlace a la hoja imprimible. */
.mmq{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:8px;vertical-align:2px;border:none;border-radius:50%;background:var(--acc);color:#fff;font:700 13px/1 system-ui,sans-serif;cursor:pointer;padding:0}
.mmq:hover{filter:brightness(1.15)}
#mmAyuda{display:none;position:fixed;z-index:9500;left:50%;top:14%;transform:translateX(-50%);width:min(470px,92vw);background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--kb-border);border-radius:0 0 8px 8px;box-shadow:0 8px 28px rgba(0,0,0,.25);color:var(--text)}
#mmAyuda.open{display:block}
#mmAyuda .hd{display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:move;border-bottom:1px solid var(--line)}
#mmAyuda .hd h3{flex:1;margin:0;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);text-align:center;padding-left:22px}
#mmAyuda .pin{background:none;border:none;cursor:pointer;font-size:13px;line-height:1;color:var(--muted)}
#mmAyuda .pin.on{color:var(--acc)}
#mmAyuda .bd{padding:12px 16px 14px;font-size:13.5px;line-height:1.55}
#mmAyuda .bd p{margin:0 0 9px}
#mmAyuda .bd a{color:var(--acc);font-weight:600}
.paso{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--acc);text-transform:uppercase;margin:0 2px 0 4px;white-space:nowrap}
/* LA MUESTRA (2026-11-26, Mario: «los que ya tienen la licencia puedan ver un demo de los rollos»): sin el pase de Salieri, el coral n.º 1
   se ve, suena y se recorre con el pin; lo demás queda apagado y arriba, una línea que dice qué es y dónde está el rollo completo. */
#mmMuestra{display:none;max-width:1280px;margin:0 auto 6px;padding:8px 12px;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-top:2px solid #501828;border-radius:8px;font-size:13px;color:var(--muted)}
html.mm-demo #mmMuestra{display:flex}
html.mm-demo .bar .btn:not(#play):not(#open):not(#coral):not(#corAnt):not(#corSig),html.mm-demo .bar select:not(#coral),html.mm-demo #mas,html.mm-demo #harm{opacity:.35;pointer-events:none}
html.mm-demo #mailbox,html.mm-demo #v3{display:none}
.banner{max-width:1280px;margin:6px auto 0;min-height:18px;font-size:12.5px;color:var(--muted);text-align:center}
.rollo{max-width:1280px;margin:8px auto 0;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px 14px;overflow-x:auto}
.sis{display:flex;align-items:flex-end;margin-top:6px}
.cc{position:relative;padding-top:30px;flex:none;border-radius:4px;transition:background .5s}
.cc svg{display:block}
.cc.nuevo{background:rgba(47,111,98,.12)}
.cc .re{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:28px;height:24px;padding:0;border:1px solid #c9c5ba;border-radius:6px;background:#fff;color:#2f6f62;font-size:15px;line-height:1;cursor:pointer}
.cc .re:hover{background:#2f6f62;color:#fff;border-color:#2f6f62}
.cc .re:focus-visible{outline:2px solid #2f6f62;outline-offset:2px}
.cc.fr::before{content:"";position:absolute;top:27px;left:3px;right:3px;height:2px;background:#2f6f62;opacity:.55}.cc.fr:not(.fr-ini)::before{left:0}.cc.fr:not(.fr-fin)::before{right:0}
.cc .nn{position:absolute;top:8px;left:4px;font-size:11px;color:#8a8d94;font-variant-numeric:tabular-nums}
.mailbox.over{outline:2px dashed var(--acc)}
#opc,#insp{position:fixed;z-index:50;width:480px;max-width:calc(100vw - 16px);max-height:70vh;display:flex;flex-direction:column;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-top:2px solid #501828;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
#opc .opc-h,#insp .opc-h{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:12px;color:var(--muted);cursor:move;user-select:none;border-bottom:1px solid var(--line)}
#opc .opc-h span,#insp .opc-h span{flex:1}
#opc .opc-b,#insp .opc-b{font:inherit;font-size:14px;width:26px;height:24px;padding:0;border:1px solid var(--line2);border-radius:5px;background:transparent;color:var(--text);cursor:pointer}
#opc .opc-b.on,#insp .opc-b.on{background:var(--acc);border-color:var(--acc);color:var(--acc-t)}
#insp{width:340px}
.ins-l{padding:8px 10px;display:grid;gap:6px}
.ins-r{display:flex;align-items:center;gap:8px;font-size:12px}
.ins-r span{width:70px;color:var(--muted)}
.ins-s{flex:1;min-width:0;font:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--line2);border-radius:6px;background:var(--paper);color:var(--text)}
#opc .opc-l{overflow:auto;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
#opc .op{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:3px;cursor:pointer;display:flex;gap:2px;overflow-x:auto}
#opc .op:hover{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
#opc .op svg{display:block;flex:none}
/* LA PUERTA DE SALIERI (2026-11-23): publicado y sin pase, el rollo no se ve; en su lugar, el candado (ver el bloque al comienzo del body) */
html.mm-puerta body>*:not(#mmCandado):not(#mm-salieri-pase){display:none!important}
#mmCandado{display:none;max-width:560px;margin:3vh auto 0;padding:18px;gap:10px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-top:2px solid #501828;border-radius:8px}
html.mm-cerrado #mmCandado{display:grid}
#mmCandado p{margin:0;color:var(--muted);line-height:1.5}
#mmCandado button{justify-self:start}

<body>
<!-- LA PUERTA DE SALIERI (2026-11-23, Mario: «estos rollos van a subir pero abren solo con Salieri activado»). En el sitio, sin el pase del Music School
     Coach, el rollo no se ve: salen este candado y la ventana del pase, la misma de las páginas de Salieri (/suite/mm-salieri.js). En el PC —localhost, o la
     página abierta del disco— el rollo abre siempre, para trabajar. ?salieri=test abre en las presentaciones, como en todo el sitio. -->
<div id="mmCandado"><p id="mmCandadoT"></p><button class="btn" id="mmCandadoB" type="button">MUSIC SCHOOL COACH</button></div>
<script>
(function(){ var MUESTRA_YA=/[?&]muestra\b/.test(location.search);   // ?muestra: la muestra también en el PC, para probarla
  // 2026-11-27 (Mario: «si tienen la dirección, ¿puedes entrar a todo el rollo?»): MM_PUERTA dice cuándo la puerta ya decidió —true con pase (o en el PC), false en la muestra—;
  // la dirección ?pieza=NNN espera esa respuesta, para que la pieza pedida no se cuele antes que la muestra
  var listo; window.MM_PUERTA=new Promise(function(r){ listo=r; });
  if(!MUESTRA_YA&&(location.protocol==='file:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))){ listo(true); return; }
  var H=document.documentElement, es=false; try{ es=localStorage.getItem('mmSiteLang')==='es'; }catch(e){}
  H.classList.add('mm-puerta');   // tapado hasta saber si hay pase
  document.getElementById('mmCandadoT').textContent=es?'Este rollo es parte del Music School Coach: el catálogo de orquestación, las clases de armonía y contrapunto, y el maestro exigente de la suite.':"This roll is part of the Music School Coach: the orchestration catalogue, the harmony and counterpoint classes, and the suite's demanding master.";
  document.getElementById('mmCandadoB').onclick=function(){ if(window.mmSalieriPuerta) mmSalieriPuerta(); };
  window.addEventListener('keydown',function(e){ if(H.classList.contains('mm-puerta')) e.stopImmediatePropagation(); },true);   // tapado, las teclas no llegan al rollo (la barra espaciadora no suena)
  var abre=function(){ listo(true); H.classList.remove('mm-puerta','mm-cerrado'); var w=document.getElementById('mm-salieri-pase'); if(w) w.classList.remove('open'); },
      // 2026-11-26: sin pase ya no sale el candado sino la muestra (el coral n.º 1); el candado queda solo si la muestra no puede abrir
      cierra=function(){ window.MM_MUESTRA=true; listo(false); H.classList.remove('mm-puerta'); H.classList.add('mm-demo');
        var go=function(){ if(window.mmMuestra) mmMuestra(); else { H.classList.remove('mm-demo'); H.classList.add('mm-puerta','mm-cerrado'); } };
        if(document.readyState==='complete') go(); else window.addEventListener('load',go); };
  document.addEventListener('mm-salieri',function(){ if(H.classList.contains('mm-demo')) location.reload(); else abre(); });   // el pase llega (también después de «Ya pagué — volver a mirar»)
  var s=document.createElement('script'); s.src='/suite/mm-salieri.js';
  s.onload=function(){ if(mmSalieriAbierto()) return abre(); mmSalieriVerificar().then(function(v){ if(v) abre(); else cierra(); },cierra); };
  if(MUESTRA_YA){ cierra(); return; }
  s.onerror=cierra; document.head.appendChild(s); })();
</script>

<div id="mmMuestra"><span id="mmMuestraT"></span><button class="btn" id="mmMuestraB" type="button">MUSIC SCHOOL COACH</button></div>

  <span class="sep"></span>

  <span class="grp"><button class="btn" id="corAnt" aria-label="Coral anterior">◀</button><select id="coral" class="btn" aria-label="Coral"></select><button class="btn" id="corSig" aria-label="Coral siguiente">▶</button><button class="btn" id="corAbre">CORAL BACH</button><button class="btn" id="corMapa" title="El mapa de este coral: las frases y sus cadencias (otra ventana)">MAP</button></span>
  <span class="sep"></span>
  <button class="btn" id="v3" title="Contrapunto y fuga (V3)">→</button>
</div>

<script>

// al calderón; cuando es 1, el primero — o random cualquiera» · «como la máquina de armonía: congelar unos compases del rollo
// y rodarlo para cambiar los que no están held; abrirlo y devolverlo con el Score; poder escoger 4 compases, o sea 3 antes

// Cada rodillo es un compás real de un coral de Bach (en Do mayor o la menor). Las uniones entre compases tienen que ser

'use strict';

// ── las reglas de la unión ──

  for(let i=0;i<4;i++) for(let j=i+1;j<4;j++){ if(a[i]<0||a[j]<0||b[i]<0||b[j]<0) continue;

  return !paralelas(a[7],b[6]); }
const cierra=i=>!!B(i)[12];

// ── el rollo de esta tonalidad y esta cifra ──

  POOLSET=new Set(POOL); SUCC=new Map();
  FRL={}; (D.frases||[]).forEach(f=>{ const b=B(f[1]); if(b[2]!==state.modo||b[3]!==ci) return; (FRL[f.length-1]=FRL[f.length-1]||[]).push(f); }); }
let FRL={};
// la nota del calderón en la voz v: la que termina donde termina el calderón (en 4/4 suele caer a mitad de compás, con la anacrusa detrás)
function fNota(b,v){ const ns=b[5][v], f=b[13]; if(f==null||f<0) return ns.length-1; let j=ns.findIndex(n=>n[0]>=0&&n[1]+n[2]===f); if(j<0) j=ns.findIndex(n=>n[0]>=0&&n[1]<f&&n[1]+n[2]>=f); return j<0?ns.length-1:j; }

// Cada compás es una unidad (Mario: «trata cada compás como una unidad, escogemos aleatoriamente los compases que podemos
// held or not»): los que no están en HOLD se escogen al azar, con uniones que Bach hace.
function huecos(){ const out=[]; let s=-1; for(let i=0;i<=state.T;i++){ const libre=i<state.T&&!state.held[i]; if(libre&&s<0) s=i; if(!libre&&s>=0){ out.push([s,i-1]); s=-1; } } return out; }

// ── el dibujo: el pentagrama doble, soprano y contralto arriba, tenor y bajo abajo ──
const GL=window.MM_GL, SS=10, K=SS/250, C='#0e2934', TPOS={C:0,D:1,E:2,F:3,G:4,A:5,B:6};

function natural(x,y){ return `<path d="M${x+1} ${y-9}V${y+4}M${x+7} ${y-4}V${y+9}M${x+1} ${y-2}L${x+7} ${y-4}M${x+1} ${y+4}L${x+7} ${y+2}" stroke="${C}" stroke-width="1.4" fill="none"/>`; }
// cuatro pentagramas, una voz en cada uno (Mario: «quiero ver cada compás en 4 pentagramas»): soprano y contralto en clave
// de sol, tenor y bajo en fa (el tenor, en sol octavada hasta el 2026-11-26). Plica según la altura; corcheas y semicorcheas barradas dentro del tiempo.
const BASEW=(b,clave)=>b&&b.length>15?(clave?200:150):(clave?300:250);   // una mitad mide 150 (200 con clave)
// 2026-11-26: un compás más corto (la anacrusa de un coral, o el último que la completa) mide según lo que dura (peso = su duración / un compás entero)
