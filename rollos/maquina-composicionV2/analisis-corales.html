<title>mm Corales de Bach · mapas y fichas</title>
<!-- mm Corales de Bach · mapas y fichas · 2026-11-27 · _Coach/maquina-composicionV2 · acompaña al rollo V2 (MAP, junto a CORAL BACH).
     Mario: «¿podríamos hacer algo similar [al mapa de las fugas] para los corales?» · «procede».
     Datos: rollo-barroco/corales-mapa.js, que escribe _V2-TRABAJO/scripts/cifrar-corales.py desde rollo-bach.json con el cifrado de las fugas
     (maquina-composicionV3/_V3-TRABAJO/scripts/cifrar-banco.py, reglas de _PLANES/_REGLAS-cifrado-armonico.md). Lo propio del coral: las frases,
     cada una cerrada por su calderón, y la cadencia que se lee en él. Es una LECTURA DE LA MÁQUINA: lo dudoso va marcado y lo mal leído se corrige.
     Los ayudantes de grados, tonalidades y progresiones son los de analisis-fugas.html (V3). Cada compás citado lleva al rollo (irA en rollo.html). -->
<style>
:root{--bg:#f4f3ef;--panel:#ffffff;--line:#d8d5cc;--line2:#b9b5aa;--text:#22252b;--muted:#6b6f78;--acc:#2f6f62;--acc-t:#ffffff;--paper:#fffdf8;color-scheme:light;--kb-border:#501828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--panel:#202226;--line:#34373d;--line2:#4a4e56;--text:#e6e6e6;--muted:#9a9ea6;--acc:#4fb39c;--acc-t:#0b1f1a;--paper:#fbf9f3;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:12px max(12px,env(safe-area-inset-left,0px)) 28px max(12px,env(safe-area-inset-right,0px));min-height:100vh}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;max-width:1280px;margin:0 auto}
.grp{display:flex;align-items:center;gap:3px}
.sep{width:1px;align-self:stretch;background:var(--line)}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:0 3px 0 2px}
.btn{font:inherit;font-size:12.5px;min-height:32px;min-width:30px;padding:4px 8px;border:1px solid var(--line2);border-radius:7px;background:transparent;color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
.btn:hover{border-color:var(--acc)}
.btn.on{background:var(--acc);border-color:var(--acc);color:var(--acc-t)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-weight:600;font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
.vinfo{max-width:1280px;margin:12px auto 0;font-size:16px;font-weight:600;text-align:center}
.vinfo span{font-weight:400;color:var(--muted)}
.banner{max-width:1280px;margin:6px auto 0;min-height:18px;font-size:12.5px;color:var(--muted);text-align:center}
.banner.duda{color:#8a4b12;background:#fbefd9;border:1px solid #ecd3a4;border-radius:8px;padding:6px 10px}
main{max-width:1280px;margin:0 auto}
.hoja{margin-top:8px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 10px 6px;overflow-x:auto;color:#22252b}
.hoja svg{display:block}
.sc{cursor:pointer}
.sc .col{fill:transparent}
.sc.gris .col{fill:rgba(0,0,0,.045)}
.sc:hover .col{fill:rgba(47,111,98,.07)}
.sc.sel .col{fill:rgba(47,111,98,.12);stroke:#2f6f62;stroke-width:1.5}
.en{cursor:pointer}
.ley{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 2px 0;font-size:12px;color:var(--muted)}
.ley i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ley i.ray{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 2px,transparent 2px 5px)}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 2px 6px}
.maq{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.chip{font:inherit;font-size:12.5px;border:1px solid transparent;border-radius:7px;padding:4px 8px;cursor:pointer;color:#22252b;line-height:1.2}
.chip b{font-weight:600;margin-left:4px}
.chip.sel{border-color:#2f6f62;box-shadow:0 0 0 2px rgba(47,111,98,.25)}
.flecha{color:var(--muted);font-size:12px}
.t-expo{background:#cfe5de}.t-ent{background:#f1e2c3}.t-epi{background:#e7e5de}.t-coda{background:#d9d6cc}
.cols{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ficha dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px}
.ficha dt{color:var(--muted);font-size:12.5px;white-space:nowrap}
.ficha dd{margin:0}
.ficha svg{display:block;width:100%;max-width:250px;height:auto;margin:4px 0 2px;background:var(--paper);border:1px solid var(--line);border-radius:6px}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.sec.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(47,111,98,.25)}
.sec header{padding:5px 10px;font-weight:600;color:#22252b;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.sec header span{font-weight:400;font-size:12px;white-space:nowrap}
.sec .cu{padding:7px 10px 9px;font-size:13px}
.sec .cu p{margin:0 0 5px}
.sec .cu p:last-child{margin-bottom:0}
.sec .cu small{display:block;color:var(--muted);font-size:12px}
.pt{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.res{margin-top:14px}
.res table{border-collapse:collapse;width:100%;font-size:13px}
.res td{padding:3px 8px 3px 0;vertical-align:top}
.res td:first-child{color:var(--muted);white-space:nowrap;width:1%}
.fila{display:grid;grid-template-columns:150px minmax(200px,1fr) minmax(280px,38%);gap:10px;align-items:center;padding:4px 6px;border-radius:7px;cursor:pointer}
.fila:hover{background:rgba(47,111,98,.09)}
.fila .n{font-variant-numeric:tabular-nums;white-space:nowrap}
.fila .n b{font-weight:600}
.fila .d{font-size:12px;color:var(--muted)}
.fila svg{display:block;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:4px}
@media (max-width:820px){.fila{grid-template-columns:1fr}}
a.ir{color:inherit;text-decoration:underline dotted;text-underline-offset:2px;cursor:pointer}
a.ir:hover{color:var(--acc);text-decoration:underline}
.hoja svg a.ir,.hoja svg a.ir:hover{text-decoration:none;cursor:pointer}
.gr{line-height:1.8}
.gr .cg{display:inline-block;white-space:nowrap;margin-right:8px}
.gr .cg a.ir{text-decoration:none}
.gr .cg i{font-style:normal;font-size:10.5px;color:var(--muted);margin-right:3px;font-variant-numeric:tabular-nums}
.gr .cg a.ir:hover i{color:var(--acc);text-decoration:underline}
.gr .du{opacity:.5}
.gr .so{color:var(--muted);font-size:12px}
.gr .mo{color:#8a4b12;font-weight:600;margin-left:3px}
footer{max-width:1280px;margin:22px auto 0;font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
/* 2026-11-27 (Mario): el mapa del coral se imprime — A4 apaisado, sin la barra, con los colores del mapa y fondo blanco */
.print-cab{display:none}
.pie-marca{display:inline-flex;align-items:center;gap:5px}
.pie-marca svg{height:12px;width:auto;fill:#2f6f62}
.pie-marca sup{font-size:8px;line-height:1;color:#2f6f62;margin:-6px 3px 0 -4px}
@page{size:A4 landscape;margin:10mm}
@media print{
  :root,:root:not([data-theme="light"]){--bg:#fff;--panel:#fff;--line:#d8d5cc;--line2:#b9b5aa;--text:#22252b;--muted:#6b6f78;--acc:#2f6f62;--paper:#fffdf8;color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff!important;color:#22252b;margin:0}
  .bar,#banner{display:none!important}
  .print-cab{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#6b6f78;border-bottom:1px solid #d8d5cc;padding-bottom:4px;margin-bottom:4px}
  .vinfo{margin-top:4px}
  main,.vinfo,footer{max-width:none}
  .hoja{overflow:visible;break-inside:avoid}
  .hoja svg{width:100%;height:auto}
  .ley,.maq{break-inside:avoid}
  h2{break-after:avoid}
  .cols{display:block}
  .cols>div+div{margin-top:10px}
  .secs{display:block;columns:4;column-gap:8px}
  .sec{break-inside:avoid;margin-bottom:8px}
  .sec header{break-after:avoid}
  .sec.sel{box-shadow:none}
  a{color:inherit;text-decoration:none}
}
/* (de las fugas) «la última página sale con un párrafo y mucho espacio libre… ¿se puede llenar con un análisis del map?» → la lectura del mapa, en prosa */
.lectura{font-size:13.5px;line-height:1.55;padding:12px 16px}
.lectura p{margin:0 0 8px}.lectura p:last-child{margin-bottom:0}
.lectura b.l{color:var(--acc)}
.lectura .dudosa{color:#8a4b12;font-size:12.5px}
@media print{.lectura{font-size:12px;line-height:1.5}.lectura p{break-inside:avoid}}
</style>
</head>

<script>

const $=id=>document.getElementById(id);
const D=window.CORALES_MAPA||{}, NUMS=Object.keys(D).sort();

// ── EL IDIOMA (2026-11-27, Mario: paso 3, los mapas en en · fr · nl · de · «procede»): el de la suite (mmCoachLang), si no el del sitio (mmSiteLang:
// es · en), si no inglés —como el título del rollo—; ?lang= manda. Los botones siguen en inglés. Las tonalidades de los datos («Sol mayor») y las
// notas de la máquina se traducen aquí, al mostrarlas; los datos no se tocan. Lo que falte en un idioma sale en inglés.
const QLANG=(()=>{ try{ return new URLSearchParams(location.search).get('lang'); }catch(e){ return null; } })();
const LANG=(()=>{ const ok=x=>['es','en','fr','nl','de'].indexOf(x)>=0; if(ok(QLANG)) return QLANG; let L='en';
  try{ const c=localStorage.getItem('mmCoachLang'), w=localStorage.getItem('mmSiteLang'); L=ok(c)?c:(['es','en'].indexOf(w)>=0?w:'en'); }catch(e){} return L; })();
document.documentElement.lang=LANG;
const NOTA={do:0,re:1,mi:2,fa:3,sol:4,la:5,si:6}, LETRA='CDEFGAB';
// «Sol mayor», «fa# menor», «Si♭ mayor» → G major · sol majeur · G majeur · G-Dur (nl y de: Fis, Bes, Es, As; en alemán si♭ = B y si = H; el menor con minúscula)
function tonN(s){ if(LANG==='es') return s; const m=String(s).match(/^(do|re|mi|fa|sol|la|si)(b|#|♭|♯)?\s+(mayor|menor)$/i); if(!m) return s;
  const i=NOTA[m[1].toLowerCase()], ac=m[2]?(/[b♭]/.test(m[2])?'b':'#'):'', may=m[3].toLowerCase()==='mayor', sg=ac==='b'?'♭':ac==='#'?'♯':'';
  if(LANG==='en') return LETRA[i]+sg+(may?' major':' minor');
  if(LANG==='fr') return m[1].toLowerCase()+sg+(may?' majeur':' mineur');
  const l=LETRA[i]; let n=ac==='#'?(LANG==='de'&&l==='B'?'His':l+'is'):ac==='b'?(l==='E'?'Es':l==='A'?'As':l==='B'?(LANG==='de'?'B':'Bes'):l+'es'):(LANG==='de'&&l==='B'?'H':l);
  if(!may) n=n.toLowerCase(); return LANG==='de'?n+(may?'-Dur':'-Moll'):n+(may?' majeur':' mineur'); }
// las notas de la máquina (lo dudoso), con sus números
const MAQ=[
  [/^la lectura no vuelve a la tonalidad principal al final$/,{en:'the reading does not return to the main key at the end',fr:'la lecture ne revient pas à la tonalité principale à la fin',nl:'de lezing keert aan het eind niet terug naar de hoofdtoonsoort',de:'die Lesart kehrt am Ende nicht zur Haupttonart zurück'}],
  [/^sujeto muy corto \((\d+) notas\): la máquina puede contar entradas de más$/,{en:'very short subject ($1 notes): the machine may count too many entries',fr:'sujet très court ($1 notes) : la machine peut compter des entrées en trop',nl:'zeer kort onderwerp ($1 noten): de machine kan te veel inzetten tellen',de:'sehr kurzes Thema ($1 Töne): die Maschine kann zu viele Einsätze zählen'}],
  [/^no todas las voces entran con el sujeto al comienzo: la exposición puede estar mal leída$/,{en:'not every voice enters with the subject at the start: the exposition may be misread',fr:'toutes les voix n’entrent pas avec le sujet au début : l’exposition peut être mal lue',nl:'niet alle stemmen zetten in het begin in met het onderwerp: de expositie kan verkeerd gelezen zijn',de:'nicht alle Stimmen setzen zu Beginn mit dem Thema ein: die Exposition kann falsch gelesen sein'}],
  [/^el sujeto leído es mucho más corto que lo que canta la primera voz antes de la respuesta$/,{en:'the subject read is much shorter than what the first voice sings before the answer',fr:'le sujet lu est bien plus court que ce que chante la première voix avant la réponse',nl:'het gelezen onderwerp is veel korter dan wat de eerste stem zingt vóór het antwoord',de:'das gelesene Thema ist viel kürzer als das, was die erste Stimme vor der Antwort singt'}],
  [/^muy pocas entradas completas \((\d+)\): revisar el sujeto$/,{en:'very few complete entries ($1): check the subject',fr:'très peu d’entrées complètes ($1) : vérifier le sujet',nl:'zeer weinig volledige inzetten ($1): het onderwerp nakijken',de:'sehr wenige vollständige Einsätze ($1): das Thema prüfen'}]];
function maqN(s){ if(LANG==='es') return s; for(const [re,t] of MAQ){ if(re.test(s)) return s.replace(re,t[LANG]||t.en); } return s; }

// lo que comparten las dos páginas (tonalidades, cadencias, progresiones, grados)
const T0={
  es:{c:'c.',tonLbl:'ton',tonTit:'Tonalidad: las regiones confirmadas y las cadencias',cadEn:(g,c)=>'Cadencia en '+g+' · c. '+c,dud:'lectura dudosa',Dud:'Lectura dudosa',en:' en ',
    mas:n=>' · y '+n+' más (en el mapa, ▾)',progLbl:'prog',progTit:'Progresiones: dónde están y cómo se arman',
    PASO_C:{3:'por quintas',4:'por quintas ascendentes',5:'por terceras descendentes',2:'por terceras ascendentes',1:'por grados ascendentes',6:'por grados descendentes'},
    PASO_AB:{3:'5ª',4:'5ª↑',5:'3ª↓',2:'3ª↑',1:'2ª↑',6:'2ª↓'},PASO_M:{1:'un grado más arriba',6:'un grado más abajo',2:'una tercera más arriba',5:'una tercera más abajo',3:'una cuarta más arriba',4:'una cuarta más abajo'},
    modelo:'por modelo',prog:k=>'Progresión '+k,progMin:k=>'progresión '+k,arma:(n,cf)=>n+' acordes: '+cf,armaM:(x,m,n,cf)=>'modelo de '+x+' acordes, cada vez '+m+', '+n+' veces: '+cf,
    hacia:(k,e,inl,VZ)=>{ const s=(k?' · lleva a la cadencia en '+k.g+' (c. '+k.c+')':'')+(e?(k?', donde entra ':' · lleva a ')+(e.cab?'la cabeza del tema':k?'el tema':'la entrada del tema')+' en '+VZ(e.v)+(k?'':' (c. '+e.c+')'):''); return inl?s.replace(/^ · lleva/,', que lleva'):s; },
    dudProg:'Lectura dudosa: la mitad o más de sus acordes lo son.',ninguna:'ninguna de cuatro acordes o más',tonalidad:'Tonalidad: ',sola:'(sola)',solaT:'sola',y:' y ',coma:','},
  en:{c:'b.',tonLbl:'key',tonTit:'Key: the confirmed regions and the cadences',cadEn:(g,c)=>'Cadence on '+g+' · b. '+c,dud:'uncertain reading',Dud:'Uncertain reading',en:' on ',
    mas:n=>' · and '+n+' more (on the map, ▾)',progLbl:'prog',progTit:'Progressions: where they are and how they are built',
    PASO_C:{3:'by fifths',4:'by rising fifths',5:'by falling thirds',2:'by rising thirds',1:'by rising steps',6:'by falling steps'},
    PASO_AB:{3:'5th',4:'5th↑',5:'3rd↓',2:'3rd↑',1:'2nd↑',6:'2nd↓'},PASO_M:{1:'one step higher',6:'one step lower',2:'a third higher',5:'a third lower',3:'a fourth higher',4:'a fourth lower'},
    modelo:'by model',prog:k=>'Progression '+k,progMin:k=>'progression '+k,arma:(n,cf)=>n+' chords: '+cf,armaM:(x,m,n,cf)=>'a model of '+x+' chords, each time '+m+', '+n+' times: '+cf,

  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+y+'" viewBox="0 0 '+W+' '+y+'" role="img" aria-label="'+TT.aria+'">'+s+'</svg>'; }

function leyendaHTML(){ const l=TT.ley; return Object.keys(CAD).map(k=>'<span><i style="background:'+CAD[k][2]+'"></i>'+CAD[k][0]+' · '+esc(TT.CAD[k][2])+'</span>').join('')+
  '<span>'+l[0]+'</span><span><i style="background:#cfe5de"></i>'+l[1]+'</span><span><i style="background:#d5e2f0"></i>'+l[2]+'</span><span><i style="background:#f1e2c3"></i>'+l[3]+'</span><span><i style="background:#ead9e6"></i>'+l[4]+'</span><span>'+l[5]+'</span><span><i style="background:#22252b;height:3px;vertical-align:3px"></i>'+l[6]+'</span>'; }

// ── la ficha ──
const yLista=a=>a.length<=1?(a[0]||''):a.slice(0,-1).join(', ')+TC.y+a[a.length-1];
function cuentaCad(f){ const m=new Map(); f.fr.forEach(p=>{ const k=p[4]==='auténtica en otro grado'?TT.autEnC(gradoS(p[6])):(TT.CAD[p[4]]||TT.CAD.otra)[3]; m.set(k,(m.get(k)||0)+1); }); return [...m.entries()].sort((a,b)=>b[1]-a[1]); }
const finales=f=>cuentaCad(f).map(x=>x[0]+(x[1]>1?' ('+x[1]+')':''));
function fichaHTML(f){ const c=cifDe(f), fila=(k,v)=>'<dt>'+k+'</dt><dd>'+v+'</dd>', ult=f.fr[f.fr.length-1]; let h='<dl>';
  h+=fila(TT.fCoral,esc(f.t)+' · '+esc(f.bwv));
  h+=fila(TT.fTon,esc(f.o)+' · '+esc(f.cifra)+' · '+pl(f.n,TT.compas));
  h+=fila(TT.fFrases,'<b>'+f.fr.length+'</b> · '+esc(finales(f).join(' · ')));
  if(c){ h+=fila(TT.fTons,tonTxt(f)+(c.r.length>1?TT.enPrinc(enCasa(f)):''));
    if(c.m&&c.m.length) h+=fila(TT.fMods,c.m.map(m=>irL(f,m[0],TC.c+' '+m[0])+' → '+esc(tonN(m[3]))+' ('+esc(m[2])+')').join(' · '));
    h+=fila(TT.fProgs,progTxt(f)); }
  if(ult) h+=fila(TT.fCierre,esc(cadNom(ult))+' ('+esc(gradoS(ult[5])+' → '+gradoS(ult[6]))+')'+TT.sopTermina(ORD[ult[8]-1]||'?'));
  return h+'</dl>'; }

// ── cada frase ──
function fraseHTML(f,p,j){ const cd=cadDe(p), t0=t0F(f,j), t1=p[3], rg=regionEn(f,t1-0.01), c=cifDe(f);
  let h='<article class="sec'+(j===state.sel?' sel':'')+'" data-k="'+j+'"><header style="background:'+cd[2]+'22;border-bottom:2px solid '+cd[2]+'">'+TT.Frase+' '+p[0]+'<span>'+irL(f,p[1],tramoF(f,j))+'</span></header><div class="cu">';
  h+='<p><span class="pt" style="background:'+cd[2]+'"></span><b>'+esc(cap(cadNom(p)))+'</b> · '+esc(gradoS(p[5])+' → '+gradoS(p[6]))+'</p>';
  h+='<p><small>'+(rg&&c&&rg[0]!==c.h?esc(TT.enReg(rg[0],tonN(rg[1]))):'')+TT.sopCal(p[2],ORD[p[8]-1]||'?')+(p[9]?' · <span style="color:#8a4b12">'+TC.dud+'</span>':'')+'</small></p>';
  return h+progHTML(f,{t0,t1})+gradosHTML(f,{t0,t1})+'</div></article>'; }
const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);

// ── LA LECTURA DEL MAPA: lo mismo que dicen el mapa, la ficha y las frases, contado en prosa ──
const hacia=(f,p)=>progHacia(f,p,true);
function lecturaHTML(f){ const c=cifDe(f), L=(t,x)=>'<p><b class="l">'+t+'.</b> '+x+'</p>', fr=f.fr, ult=fr[fr.length-1]; let h='';
  const aut=fr.filter(p=>/^auténtica (perfecta|imperfecta)$/.test(p[4])).length, semi=fr.filter(p=>/^semicadencia/.test(p[4])).length;
  h+=L(TT.L.forma,TT.forma({n:f.n,cifra:esc(f.cifra),ton:esc(f.o),nf:fr.length,fin:esc(yLista(finales(f))),aut,semi}));
  if(c){ let to=(c.r.length===1?TT.todo:'')+tonTxt(f)+'. ';
    if(c.m&&c.m.length) to+=TT.modula(c.m.length,c.m.map(m=>({c:irL(f,m[0],TC.c+' '+m[0]),k:esc(tonN(m[3]))})));
    else{ const ot=fr.filter(p=>p[4]==='auténtica en otro grado'); to+=ot.length?TT.noModOt(yLista(ot.map(p=>TT.otEn(p[0],gradoS(p[6]))))):TT.noMod; }
    h+=L(TT.L.ton,to); }
  h+=L(TT.L.frases,cap(fr.map((p,j)=>TT.fraseL({n:p[0],c:irL(f,p[1],tramoF(f,j)),cad:esc(cadNom(p)),gg:esc(gradoS(p[5])+' → '+gradoS(p[6])),ord:ORD[p[8]-1]||'?',dud:p[9]})).join('; '))+'.');
  const nota=fr.filter(p=>/rota|frigia|plagal/.test(p[4])), ps=progDe(f), est=[];
  nota.forEach(p=>est.push(TT.estCad(esc(cadNom(p)),p[0],irL(f,p[2],TC.c+' '+p[2]))));
  ps.slice(0,3).forEach(p=>est.push(TT.estProg(esc(TC.progMin(progK(p))),irL(f,p[3],tramo(f,p[1],p[2])),esc(p[7].replace(/–/g,' – ')),esc(hacia(f,p)))));
  if(est.length) h+=L(TT.L.est,cap(est.join('; '))+(ps.length>3?TT.estMas(ps.length-3):'')+'.');
  if(ult){ const pic=/menor/.test(D[f.num].o)&&/^I(?![IV])/.test(ult[6]); h+=L(TT.L.cierre,TT.cierre(esc(cadNom(ult)),esc(gradoS(ult[5])+' → '+gradoS(ult[6])),ORD[ult[8]-1]||'?',pic)); }
  const dud=[...(c&&c.d||[]).map(maqN)]; const nd=fr.filter(p=>p[9]).length; if(nd) dud.push(TT.dudFr(nd));
  if(dud.length) h+='<p class="dudosa">'+TC.Dud+': '+esc(dud.join(' · '))+'.</p>';
  return h; }

function selecciona(k){ state.sel=state.sel===k?-1:k; render(); }
function pintaMapa(){ const f=actual(), W=Math.max(640,$('mapa').clientWidth-22); $('mapa').innerHTML=mapaSVG(f,W);
  document.querySelectorAll('#mapa .sc').forEach(g=>{ g.addEventListener('click',e=>{ if(!e.target.closest('a')) selecciona(+g.dataset.k); }); }); }
const actual=()=>piezaDe(NUMS[state.i]);
function render(){ const f=actual(); if(!f) return;
  $('num').textContent=f.num;
  $('vinfo').innerHTML=esc(f.num+' · '+f.t+' · '+f.o)+' <span>· '+esc(f.bwv)+' · '+esc(f.cifra)+' · '+f.n+' '+TT.compas[1]+' · '+pl(f.fr.length,TT.frase)+'</span>';
  const c=cifDe(f), nd=f.fr.filter(p=>p[9]).length, b=$('banner'); b.className='banner'+(nd||(c&&c.d&&c.d.length)?' duda':'');
  b.textContent=nd||(c&&c.d&&c.d.length)?TC.Dud+': '+[...(c&&c.d||[]).map(maqN),...(nd?[TT.cadSin(nd)]:[])].join(' · ')+'.':'';
  $('ley').innerHTML=leyendaHTML(); pintaMapa();
  $('maq').innerHTML=f.fr.map((p,j)=>(j?'<span class="flecha">→</span>':'')+'<button class="chip'+(j===state.sel?' sel':'')+'" data-k="'+j+'" style="background:'+cadDe(p)[2]+'33" title="'+esc(cadNom(p))+'">'+TT.Frase+' '+p[0]+'<b>· '+esc(cadAb(p))+'</b></button>').join('');
  document.querySelectorAll('#maq .chip').forEach(g=>{ g.onclick=()=>selecciona(+g.dataset.k); });
  $('ficha').innerHTML=fichaHTML(f);
  $('secs').innerHTML=f.fr.map((p,j)=>fraseHTML(f,p,j)).join('');
  $('lectura').innerHTML=lecturaHTML(f);
  try{ history.replaceState(null,'','?n='+f.num+(QLANG?'&lang='+LANG:'')); }catch(e){} }
function paso(d){ state.i=(state.i+d+NUMS.length)%NUMS.length; state.sel=-1; render(); }
function arranca(){
  // los textos fijos de la página, en su idioma
  document.title=TT.title; $('cabTxt').textContent=TT.cab; $('maqT').textContent=TT.hMaq; $('fichaT').textContent=TT.hFicha; $('secsT').textContent=TT.hSecs; $('lecT').textContent=TT.hLec;
  const q=new URLSearchParams(location.search);
  if(q.has('n')){ const k=NUMS.indexOf(String(q.get('n')).padStart(3,'0')); if(k>=0) state.i=k; }
  // ← : si esta ventana la abrió el rollo (MAP), se cierra y queda el rollo como estaba; si se abrió sola, va a rollo.html
  $('volver').onclick=e=>{ let op=null; try{ op=window.opener&&!window.opener.closed?window.opener:null; }catch(x){} if(!op) return; e.preventDefault(); try{ op.focus(); }catch(x){} window.close(); };
  // los enlaces de compás: si el rollo abrió esta ventana, el rollo abre el coral en ese compás (irA) y pasa adelante; si no, rollo.html?pieza=NNN&c=N en «mm-rollo»
  document.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('a.ir'); if(!a) return; e.stopPropagation();
    let op=null; try{ op=window.opener&&!window.opener.closed&&typeof window.opener.irA==='function'?window.opener:null; }catch(x){} if(!op) return;
    e.preventDefault(); try{ op.irA(a.dataset.n,+a.dataset.c); op.focus(); }catch(x){} setTimeout(()=>{ if(document.hasFocus()) window.close(); },450); },true);
  $('prev').onclick=()=>paso(-1); $('next').onclick=()=>paso(1);
  document.addEventListener('keydown',e=>{ if(e.target.closest('input,textarea,select')) return; if(e.key==='ArrowLeft'){ paso(-1); e.preventDefault(); } else if(e.key==='ArrowRight'){ paso(1); e.preventDefault(); } });
  let rz=null; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(pintaMapa,120); });
  $('pie').innerHTML=TT.pie(NUMS.length,window.CORALES_FECHA?' ('+esc(window.CORALES_FECHA)+')':'');
  render(); }
arranca();
</script>
