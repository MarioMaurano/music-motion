<!DOCTYPE html>

<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<script>try{var t=localStorage['getItem']('mmTheme');if(['dark','gray','clear','contrast']['indexOf'](t)>=0x0)document['documentElement']['setAttribute']('data-theme',t);}catch(a){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>m Δ° m CONSOLE · mmk · V2.1.4</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Montserrat:wght@400;700;900&family=Playfair+Display:wght@400;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070e; --panel:#0d0d18; --panel2:#111120; --border:#1e1e34;
    --gold:#c8a84a; --gold-d:#5a4a18;
    --teal:#38b09a; --teal-d:#184840;
    --rose:#c04468; --rose-d:#501828;
    --blue:#4868c0;
    --text:#e0e0f4; --textd:#9898c8; --textm:#c0c0e0;
    --kb-border:#501828;   /* wine red — suite top-border accent */
    --led-lo:#38b09a; --led-mid:#c8a84a; --led-hi:#c04468;
    --meter-off:#07070e;   /* lo apagado del medidor = el fondo de su bahia */
    --meter-tick:rgba(255,255,255,.30);   /* graduacion grabada: se lee con el medidor en cero */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'DM Mono',monospace;overflow:hidden;
    display:flex;flex-direction:column;
  }

  /* ── TOP BAR ─────────────────────────────────────────── */
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:8px 14px;border-bottom:2px solid var(--kb-border);
    background:var(--panel);
  }
  .brand{display:flex;flex-direction:column;line-height:1}
  .brand-logo{display:flex;align-items:center;gap:8px}
  .brand-mm-logo{flex-shrink:0;height:32px;width:auto;color:var(--text)}
  .brand-name{font-family:'Montserrat',sans-serif;font-weight:700;font-size:25px;
    letter-spacing:3px;color:var(--text);text-transform:uppercase}
  .brand-score{font-family:'Montserrat',sans-serif;font-weight:400;font-size:10px;
    letter-spacing:1px;color:#ff8c00;text-transform:lowercase;margin-left:4px}
  .topbar-spacer{flex:1}
  .pill{
    font-size:9px;letter-spacing:2px;text-transform:uppercase;
    border:1px solid var(--border);color:var(--textd);
    padding:5px 10px;border-radius:2px;
  }
  .pill.sync{border-color:var(--teal-d);color:var(--teal)}
  .pill.hint{border-color:var(--gold-d);color:var(--gold)}

  /* ── CONSOLE SURFACE ─────────────────────────────────── */
  .console-body{flex:1;display:flex;min-height:0}   /* canales (scrollean) + master fijo a la derecha */
  .surface{
    flex:1;min-width:0;display:flex;gap:6px;align-items:stretch;
    padding:14px;overflow-x:auto;
  }
  /* MASTER: columna fija a la derecha, no scrollea, siempre visible al achicar */
  .master-col{
    flex:none;display:flex;align-items:stretch;
    padding:14px 14px 14px 8px;
    border-left:2px solid var(--kb-border);   /* separador wine = zona master */
    background:var(--panel2);
  }
  /* La tira cede ancho para que el mueble entre en la ventana: 78px es su tamano natural y 58 el
     minimo en el que el rotulo del instrumento todavia dice algo — el limite lo pone el nombre,
     no la bahia: un canal se encuentra por como se llama. Una mesa muestra sus
     canales; recien cuando ni encogiendo entran, vuelve el scroll. */
  .strip{
    flex:1 1 78px;max-width:78px;min-width:66px;
    display:flex;flex-direction:column;align-items:center;
    background:var(--panel2);border:1px solid var(--border);
    border-top:2px solid var(--kb-border);
    padding:8px 6px;gap:8px;
  }
  /* #2 — canal activo: franja superior en su propio color (los inactivos quedan con el wine neutro) */
  .surface .strip:not(.dim){border-top:3px solid var(--chc)}
  .strip.dim{opacity:.4}
  /* 2026-08-29: los canales que la obra no usa NO ocupan sitio. Atenuados seguian gastando 78px
     cada uno: con una orquesta de 18 quedaban 14 columnas vacias empujando al resto fuera de la
     ventana, y encontrar un canal era rodar a ciegas. El boton EN USO / 32 CH abre el mueble entero. */
  .strip.off{display:none}
  /* 2026-08-24 (Mario: «en uso parece otra aplicacion»): el recuadro es el lenguaje de los botones
     ⊞ — abren OTRA ventana. Este no abre nada, filtra lo que se ve en esta mesa, asi que pierde el
     borde y el relleno del hover y queda como rotulo encendido/apagado. */
  .banco{
    font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;padding:3px 4px;
    border:none;background:transparent;color:var(--teal);
    cursor:pointer;white-space:nowrap;transition:color .12s,opacity .12s;margin-right:8px;opacity:.9;
  }
  .banco:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
  .banco.todos{color:var(--textd)}
  .ch-head{display:flex;align-items:center;gap:6px;width:100%}
  .surface .ch-head{cursor:pointer}                       /* el cabezal es el SEL del canal */
  .surface .strip.sel{box-shadow:inset 0 0 0 1px var(--gold)}
  .surface .strip.sel .ch-num{color:var(--gold)}
  .ch-dot{width:10px;height:10px;border-radius:2px;flex:0 0 auto;transition:box-shadow .18s}
  .surface .strip:not(.dim) .ch-dot{filter:brightness(1.32) saturate(1.06);box-shadow:0 0 6px var(--chc), 0 0 2px var(--chc)}   /* canal activo = más luminoso (mismo color code) */
  .ch-head{overflow:hidden}
  .ch-num{font-size:10px;font-weight:500;letter-spacing:0;color:var(--text);white-space:nowrap}
  .ch-instr{
    width:100%;background:var(--panel);color:var(--textm);
    border:1px solid var(--border);border-radius:2px;
    font-family:'DM Mono',monospace;font-size:9px;
    padding:4px 4px;text-align:center;cursor:pointer;
  }
  .ch-instr:hover{border-color:var(--gold)}
  /* 2026-08-29: la chapa del canal (ch.abbr del Score) — 'fl I', 'vn II'. Va en el color del
     canal, el mismo codigo que el punto y la franja. Vacia no ocupa: nada de cajita fantasma. */
  .ch-abbr{width:100%;text-align:center;font-size:9px;letter-spacing:1px;color:var(--chc);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-4px}
  .ch-abbr:empty{display:none}
  .sec-abbr{width:100%;text-align:center;font-size:10px;letter-spacing:1px;color:var(--gold);margin-top:-2px}
  .sec-abbr:empty{display:none}

  /* pan knob */
  .knob-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
  .knob{width:46px;height:46px;cursor:ns-resize;touch-action:none}
  .knob-track{stroke:var(--border);stroke-width:3;fill:none}
  .knob-ind{stroke:var(--gold);stroke-width:2;stroke-linecap:round}
  .knob-dial{fill:var(--panel);stroke:var(--border);stroke-width:1}
  .pan-val{font-size:8px;color:var(--textd);letter-spacing:1px}
  .bal-led{width:7px;height:7px;border-radius:50%;background:var(--textd);opacity:.4;transition:background .1s,box-shadow .1s,opacity .1s}
  /* 2026-08-24 (Mario: «¿la Console no deberia tener REV, TONO y CAL sincronizados con el Keyboard?»):
     el master de la suite estaba partido — nivel y balance aca, reverb/tono/calor alla, donde vive el
     motor. Estas tres perillas son MANDOS A DISTANCIA de las del Keyboard, con el mismo contrato
     bidireccional que VOL y BAL: aplicar no emite, solo el gesto emite. Sin Keyboard abierto no hay
     motor que las obedezca, y se apagan (.nolink) con la misma presencia que enciende los botones ⊞. */
  /* La tira del master mide 78 px (max-width de .strip): las tres no entran en fila, van apiladas
     — rotulo · perilla · LED — que ademas es como se leen en el Keyboard, una debajo de la otra. */
  .mfx{display:flex;flex-direction:row;gap:4px;align-items:flex-start;justify-content:center;width:100%;padding:3px 0 1px;transition:opacity .2s}
  .mfx.nolink{opacity:.3}
  .mfx-cell{display:flex;flex-direction:column;align-items:center;gap:1px}
  .mfx-lbl{font-size:7px;letter-spacing:1px;color:var(--textd);text-transform:uppercase}
  .strip.master .mfx .knob{width:30px;height:30px;flex:none}
  .mfx .bal-led{width:5px;height:5px;flex:none}

  /* meter + fader row */
  .mf{display:flex;gap:6px;align-items:flex-end;flex:1;width:100%;justify-content:center;padding:2px 0}
  /* MEDIDOR (2026-08-29): la escalera de color es FIJA y vive en el fondo — una consola tiene el
     rojo arriba SIEMPRE, no al 100% de la barra que hay. Lo apagado se tapa desde arriba con .shade.
     El fondo lo pinta _pielMedidor() con la MISMA tabla que la escala, para que marcas y escala no
     puedan separarse. .pk es la retencion de pico y .over el testigo, que queda prendido hasta el clic. */
  .meter{
    width:10px;height:100%;min-height:160px;background-color:var(--meter-off);
    border:1px solid var(--border);border-radius:1px;
    position:relative;overflow:hidden;cursor:pointer;
  }
  .meter .shade{position:absolute;left:0;right:0;top:0;height:100%;background:var(--meter-off);pointer-events:none}
  /* La escala va ENCIMA de la tapa: grabada en la bahia, visible con el medidor en cero. */
  .meter .scale{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
  .meter .pk{position:absolute;left:0;right:0;height:2px;background:var(--text);opacity:0;pointer-events:none}
  .meter .over{position:absolute;left:0;right:0;top:0;height:3px;pointer-events:none}
  .meter .over.on{background:var(--led-hi);box-shadow:0 0 5px var(--led-hi)}
  /* 2026-08-29: el bloque FX se fue de la tira y el fader recupera su alto — en una mesa es el
     elemento mas alto, no el que cede. Y deja de vestirse como el medidor: la ranura recorrida va
     en el DORADO del cursor (el medidor tiene la escalera verde/ambar/roja, que es suya). */
  .fader{
    position:relative;width:26px;height:100%;min-height:160px;
    cursor:ns-resize;touch-action:none;
  }
  .fader-track{
    position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:4px;height:100%;background:var(--border);border-radius:2px;
  }
  .fader-fill{
    position:absolute;left:50%;transform:translateX(-50%);
    width:4px;background:var(--gold-d);border-radius:2px;bottom:0;
  }
  .fader-cap{
    position:absolute;left:50%;transform:translate(-50%,50%);
    width:26px;height:13px;background:var(--panel);
    border:1px solid var(--gold);border-radius:2px;
    box-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .fader-cap::after{content:"";position:absolute;left:3px;right:3px;top:50%;
    height:1px;background:var(--gold);transform:translateY(-50%)}
  .db{font-size:9.5px;color:var(--text);letter-spacing:.3px;min-height:12px;white-space:nowrap}   /* 2026-09-01: legible — dB · % */

  /* mute / solo */
  .ms{display:flex;gap:4px;width:100%}
  .ms button{
    flex:1;background:var(--panel);border:1px solid var(--border);
    color:var(--textd);font-family:'DM Mono',monospace;font-size:9px;
    letter-spacing:1px;padding:5px 0;cursor:pointer;border-radius:2px;
  }
  .ms button:hover{border-color:var(--gold);color:var(--gold)}
  .ms button.m.on{background:var(--rose-d);border-color:var(--rose);color:#f0c0cc}
  .ms button.s.on{background:var(--gold-d);border-color:var(--gold);color:var(--gold)}

  /* per-channel effect toggles (lit buttons, default on, click = bypass) */
  .fx{width:100%;border-top:1px dashed var(--border);padding-top:6px;display:flex;flex-direction:column;gap:5px}
  .fx-title{font-size:7px;letter-spacing:2px;color:var(--textd);text-transform:uppercase;text-align:center}
  /* 2026-08-28 (Mario: «es un poco dificil de leer»): UNA celda por linea. En dos columnas el
     knob no pasaba de 26px dentro de una tira de 78 — con una sola columna entra al doble, y
     el boton con su LED gana el ancho entero de la tira. El fader cede el sitio: es un numero
     y ya tiene su lectura al pie. */
  .fx-grid{display:grid;grid-template-columns:1fr;gap:7px}
  .fx-cell{display:flex;flex-direction:column;align-items:center;gap:3px}
  .fx-knob{width:46px;height:46px;cursor:ns-resize;touch-action:none}
  .fx-knob .kd{fill:var(--panel2);stroke:var(--border);stroke-width:1}
  .fx-knob .kt{stroke:var(--border);stroke-width:3;fill:none}
  .fx-knob .ki{stroke:var(--fxl);stroke-width:2.5;stroke-linecap:round}
  .fxbtn{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;white-space:nowrap;background:var(--panel);
    border:1px solid var(--border);border-radius:2px;padding:4px 5px;cursor:pointer;font-size:9px;
    letter-spacing:1px;color:#aeaebc;user-select:none}
  .fxbtn .led{width:6px;height:6px;border-radius:50%;background:var(--border);flex:0 0 auto}
  .fx-cell.on .fxbtn .led{background:var(--fxc)}
  .fx-cell:not(.on){opacity:.4}

  /* SECCION DE CANAL: las perillas que no son de escucha, una sola vez, sobre el canal elegido */
  .strip.chsec{flex:0 0 132px;border-top-color:var(--gold);background:var(--panel)}
  .strip.chsec .ch-head{justify-content:center}
  .chsec .ch-num{color:var(--gold)}
  .sec-inst{width:100%;text-align:center;font-size:9px;letter-spacing:1px;color:var(--textm);
    padding:4px 2px;border:1px solid var(--border);border-radius:2px;background:var(--panel2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chsec .fx{flex:1;display:flex;flex-direction:column}
  .chsec .fx-grid{flex:1;justify-content:space-evenly}
  .chsec .fx-knob{width:64px;height:64px}
  .chsec .fxbtn{font-size:10px;padding:6px 5px}

  /* master strip */
  .strip.master{flex:0 0 124px;max-width:124px;border-top-color:var(--gold);background:var(--panel)}   /* más ancho que los canales (78px): es el general.
     2026-08-24: el max-width:78px de .strip lo recortaba y la regla de arriba no hacia nada — la tira general medía lo mismo que un canal cualquiera. */
  .strip.master .ch-head{justify-content:center}   /* título MASTER centrado */
  .strip.master .knob{width:60px;height:60px}      /* L/R más grande: es general, no por canal */
  .master .ch-num{color:var(--gold)}
  .master .fader-fill{background:var(--gold)}
  .master .fader-cap{border-color:var(--gold)}

  /* ── FOOTER ──────────────────────────────────────────── */
  .footer{
    border-top:1px solid var(--border);background:var(--panel);
    padding:9px 18px;font-size:11px;letter-spacing:1px;color:var(--textd);
    display:flex;align-items:center;
  }
  .footer .v{color:var(--gold)}
  .footer .mock{color:var(--rose)}
  .footer strong{color:#fff;font-weight:700}
  .footer a{color:var(--text)}

  /* ── TRANSPORT (treatment B · synced via mm-sync) ─────── */
  .pill.sync.on{border-color:var(--teal);background:var(--teal-d);color:var(--teal)}
  .transport{
    position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;row-gap:8px;
    padding:12px 20px;border-top:2px solid var(--kb-border);background:var(--panel);
  }
  .transport-controls{display:flex;gap:5px;flex:1 1 0;min-width:max-content}
  .transport-btn{
    background:var(--panel2);border:1px solid var(--border);color:var(--textm);
    font-size:19px;line-height:1;padding:8px 13px;border-radius:2px;cursor:pointer;
  }
  .transport-btn:hover{border-color:var(--blue);color:var(--blue)}
  .transport-btn.playing{border-color:var(--teal);background:var(--teal-d);color:var(--teal)}
  .transport-btn.nosync{opacity:.35;cursor:default}
  .transport-btn.nosync:hover{border-color:var(--border);color:var(--textm)}
  /* 2026-08-24 (pedido de Mario: «Go|Loop es parte esencial del uso, dale mas importancia»):
     el navegador deja de colgar del reloj como una linea chica y pasa a ser una CAJA al lado del
     tiempo, en la misma fila. Debajo de 880 px vuelve a apilarse, que es donde la fila no entra
     entre el transporte y los contadores. */
  .time-wrap{display:flex;flex:0 1 auto;margin:0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 18px;text-align:center}
  .time-col{display:flex;flex-direction:column;align-items:center}
  .ro-lbl{font-size:8px;letter-spacing:3px;color:var(--textd);text-transform:uppercase}
  .time-wrap .time{font-size:28px;font-weight:500;color:var(--teal);letter-spacing:1px;line-height:1.05}
  .transport-families{display:flex;gap:30px;flex:1 1 0;min-width:max-content;justify-content:flex-end}
  .ro-grp{display:flex;gap:14px}
  .ro-cell{display:flex;flex-direction:column;align-items:center;text-align:center}
  .ro-cell .ro-val{font-size:17px;font-weight:500;color:var(--text)}
  /* 2026-08-24: el total, al lado del numero vigente (compas) y bajo el reloj (tiempo). SUBDIV se
     fue: era la grilla de ESCRITURA del Score (STATE.gridDiv), que ni siquiera viaja por el bus —
     mostraba 1 desde que se abria la app. En una mesa no significa nada; el total, si. */
  .ro-tot{font-size:11px;font-weight:500;color:var(--textd);margin-left:1px}
  .time-hdr{display:flex;align-items:baseline;gap:6px}
  .time-tot{font-size:10px;color:var(--textd);letter-spacing:1px;line-height:1}
  .ro-cell.gold .ro-val{color:var(--gold)}
  /* 2026-08-28: el navegador de trabajo, colgado del reloj. La Console no conoce la partitura:
     manda el numero de compas y el Score resuelve (GOTO / LOOP). */
  .nav-row{display:flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--border);
    border-radius:3px;background:var(--panel2)}
  .nav-in{width:36px;background:transparent;border:none;border-bottom:1px solid var(--border);
    color:var(--text);font-family:inherit;font-size:15px;text-align:center;padding:0 1px;outline:none}
  .nav-in::placeholder{color:var(--textd);font-size:12px}
  .nav-in:focus{border-bottom-color:var(--teal);color:var(--teal)}
  .nav-lbl{font-size:9px;letter-spacing:2px}
  .nav-lbl.go{color:var(--teal)}
  .nav-lbl.loop{color:var(--gold)}
  .nav-sep{width:1px;height:20px;background:var(--border);margin:0 3px}
  .nav-row .transport-btn{font-size:14px;padding:4px 8px}
  /* 2026-08-24 (Mario): A y B toman el color que tienen en el Score, donde el triangulo de A es
     teal y el de B azul (SCORE NAVIGATOR, renderTriangle). El oro queda para el 🔁 encendido, que
     es el color del boton LOOP activo del Score (.btn.active). */
  .nav-row .nav-take{font-size:11px;padding:3px 6px;opacity:.7}
  .nav-row .nav-take:hover{opacity:1}
  .nav-row #takeA{color:var(--teal)}
  .nav-row #takeA:hover{color:var(--teal);border-color:var(--teal)}
  .nav-row #takeB{color:#5b8dee}
  .nav-row #takeB:hover{color:#5b8dee;border-color:#5b8dee}
  #loopAIn{color:var(--teal)}
  #loopAIn:focus{border-bottom-color:var(--teal);color:var(--teal)}
  #loopBIn{color:#5b8dee}
  #loopBIn:focus{border-bottom-color:#5b8dee;color:#5b8dee}
  .nav-row .nav-clr:hover{color:var(--rose);border-color:var(--rose)}
  .nav-row .transport-btn.on{border-color:var(--gold);background:var(--gold-d);color:var(--gold)}
  .nav-dash{font-size:12px;color:var(--textm)}
  /* el reloj ya no esta posicionado en absoluto: los tres bloques del transporte son columnas de
     un flex (los dos laterales con flex:1 1 0, asi el centro queda centrado de verdad) y el
     navegador BAJA solo cuando la fila no entra, en vez de superponerse. */
.themetog{display:inline-flex;gap:7px;align-items:center;vertical-align:middle;flex:none}
.themetog button{width:16px;height:16px;border-radius:50%;border:1px solid var(--border);cursor:pointer;padding:0;transition:transform .12s,box-shadow .12s}
.themetog button:hover{transform:scale(1.15)}
.themetog button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--gold)}

/* ── animación de cards y botones — TODOS los temas (clear overridea el color de la sombra) ── */
.strip{transition:transform .15s,box-shadow .15s,border-color .15s}
.strip:not(.dim):hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.55)}
.transport-btn{transition:transform .12s,box-shadow .12s,border-color .12s,color .12s}
.transport-btn:not(.nosync):hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.fxbtn{transition:transform .12s,box-shadow .12s,border-color .12s}
.fx-cell.on:hover .fxbtn{transform:translateY(-1px);box-shadow:0 3px 9px rgba(0,0,0,.45)}
.fx-cell.on:hover .fxbtn .led{box-shadow:0 0 6px var(--fxc)}
.ms button{transition:transform .12s,box-shadow .12s,border-color .12s,color .12s}
.ms button:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.45)}
</style>

<style>
/* ── CLEAR afinado para la densidad de la Console (no toca el canónico del sitio) ── */
[data-theme="clear"]{
  --bg:#e6dcb8;                 /* fondo más profundo → más contraste de texto + strips despegan */
  --panel:#f7efd6;
  --panel2:#fdf7e6;             /* strips más claros que el fondo = panel elevado */
  --border:#bda268;             /* borde más marcado para separar bloques */

  --teal:#2c8a5a; --teal-d:#c4e4cc;   /* teal jade cálido (2026-06-10) */

/* inactivos: menos fantasmal sobre crema */
[data-theme="clear"] .strip.dim{opacity:.62}
[data-theme="clear"] .fx-cell:not(.on){opacity:.5}
/* sombras cálidas sobre crema (la animación base es de todos los temas) */
[data-theme="clear"] .strip:not(.dim){box-shadow:0 2px 11px rgba(120,90,30,.17)}
[data-theme="clear"] .strip:not(.dim):hover{box-shadow:0 12px 28px rgba(120,90,30,.24)}
[data-theme="clear"] .transport-btn:not(.nosync):hover{box-shadow:0 4px 12px rgba(120,90,30,.20)}
/* textos hardcodeados claro-sobre-claro → legibles en crema */
[data-theme="clear"] .footer strong{color:#2a2410}
/* header y footer en caramelo claro (más oscuros que el papel = marco cálido) */
[data-theme="clear"] .topbar{background:#d6c186}
[data-theme="clear"] .footer{background:#d6c186}
[data-theme="clear"] .transport{background:#e3d2a0}   /* más claro que el marco → queda "adentro", no es la barra oscura */
[data-theme="clear"] .strip.master{background:#e3d2a0}        /* master = mismo color que el transport */
[data-theme="clear"] .master-col{background:#e3d2a0}          /* columna del master = mismo fondo que el transport */
/* logo: el naranja Δ° se apaga sobre caramelo → caramelo-naranja más profundo */
[data-theme="clear"] .topbar path[fill="#ea8b18"],
[data-theme="clear"] .footer path[fill="#ea8b18"]{fill:#b5651d}
[data-theme="clear"] .brand-score{color:#5e3c1a}   /* mmk en brown oscuro */
/* estados activos apagados (tinte bajo en croma, no chillan sobre crema) */
[data-theme="clear"] .ms button.m.on{background:#d6ccb6;border-color:#574b3b;color:#3f352a}   /* mute: marrón/grafito neutro ("apagado"), no el rose de dark */
[data-theme="clear"] .ms button.s.on{background:#e9ddbb;border-color:#936610;color:#6e4e0e}
[data-theme="clear"] .fxbtn{background:#f3ead0;border-color:#c2ad78;color:#5e3c1a}
/* legibilidad en clear: los labels mono chicos se leen débiles por finos, no por color → más peso */
[data-theme="clear"] .ch-num,
[data-theme="clear"] .ro-lbl,
[data-theme="clear"] .fx-title,
[data-theme="clear"] .pan-val,
[data-theme="clear"] .db,
[data-theme="clear"] .fxbtn,
[data-theme="clear"] .ch-instr,
[data-theme="clear"] .pill{font-weight:500}
/* y un escalón de tamaño en los labels de 7px, ilegibles a ese tamaño sobre crema */
[data-theme="clear"] .fx-title{font-size:8px}
[data-theme="clear"] .fxbtn{font-size:8px}
[data-theme="clear"] .fxbtn .led{width:9px;height:9px}
[data-theme="clear"] .ro-lbl{font-size:9px}
[data-theme="clear"] .db{font-size:9px}
[data-theme="clear"] .pan-val{font-size:9px}
[data-theme="clear"] .fx-cell.on .fxbtn{border-color:#bda268}

/* knobs legibles: pista + dial con más cuerpo sobre crema */
[data-theme="clear"] .knob-track{stroke:#8a5d24}
[data-theme="clear"] .knob-dial{fill:#f0e6c8;stroke:#8a5d24}
[data-theme="clear"] .knob-ind{stroke:#936610}
[data-theme="clear"] .fx-knob .kd{fill:#f0e6c8;stroke:#8a5d24}
[data-theme="clear"] .fx-knob .kt{stroke:#8a5d24}
/* #1 — bahía del fader: groove + meter recesados (que se lean sobre crema) + cap más presente */
[data-theme="clear"] .fader-track{width:5px;background:#c6b083;box-shadow:inset 0 0 2px rgba(94,60,26,.38)}
[data-theme="clear"]{--meter-off:#e3d7b6;--meter-tick:rgba(94,60,26,.45)}
[data-theme="clear"] .meter{border-color:#c2ad78;box-shadow:inset 0 1px 2px rgba(94,60,26,.20)}
[data-theme="clear"] .fader-cap{width:30px;height:13px;background:#f3ead0;border-color:#8a5d24;box-shadow:0 1px 4px rgba(94,60,26,.30)}
/* knobs del header (luminosidad + volumen): resaltan contra el caramelo */
[data-theme="clear"] #scVolKnob circle{fill:#f4ead0;stroke:#7a4f1c}
[data-theme="clear"] #scVolKnob path{stroke:#7a4f1c}

/* luces e indicadores: deepear los pastel inline para que piquen sobre crema */
[data-theme="clear"] .ch-dot{box-shadow:0 0 0 1px rgba(60,45,15,.2)}
/* fx en clear: 4 hues bien separados (oro · púrpura · rojo · azul) para no confundirse */
[data-theme="clear"] .fx-cell[data-fx="agog"]{--fxc:#a8780e!important;--fxl:#a8780e!important}
[data-theme="clear"] .fx-cell[data-fx="asym"]{--fxc:#7e3aa8!important;--fxl:#7e3aa8!important}
[data-theme="clear"] .fx-cell[data-fx="pres"]{--fxc:#b0303a!important;--fxl:#b0303a!important}
[data-theme="clear"] .fx-cell[data-fx="art"]{--fxc:#2a5db0!important;--fxl:#2a5db0!important}

/* sombras cálidas de los botones chicos (la animación base es de todos los temas) */
[data-theme="clear"] .fx-cell.on:hover .fxbtn{box-shadow:0 3px 9px rgba(120,90,30,.20)}
[data-theme="clear"] .ms button:hover{box-shadow:0 3px 8px rgba(120,90,30,.18)}
